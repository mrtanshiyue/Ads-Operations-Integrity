name: Revert Loader Cache Key

on:
  push:
    branches: [fix/private-cloud-shop-ui-preserve-v2]
    paths:
      - "tools/revert_loader_cache_key.py"
      - ".github/workflows/revert-loader-cache-key.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical Loader URL
        run: python3 tools/revert_loader_cache_key.py
      - name: Update regression assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-progressive-loader.mjs')
          text = path.read_text(encoding='utf-8')
          old = "assert.match(index, /assets\\/private-cloud-warehouse-v4\\.js\\?v=4\\.3\\.0-layout2/);"
          new = "assert.match(index, /assets\\/private-cloud-warehouse-v4\\.js/);\nassert.doesNotMatch(index, /assets\\/private-cloud-warehouse-v4\\.js\\?v=/);"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Loader cache assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/test-progressive-loader.mjs
          node scripts/test-progressive-loader.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/test-progressive-loader.mjs
          git commit -m "Keep canonical Loader URL while versioning Shop UI"
          git push origin HEAD:fix/private-cloud-shop-ui-preserve-v2
