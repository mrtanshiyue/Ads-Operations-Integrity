name: 265 Dev runtime read-only acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/265-dev-runtime-readonly-acceptance.yml'

permissions:
  contents: write

jobs:
  accept-dev:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/265-dev-runtime-readonly-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 2669f44813f76c370eed7c0f51378e3f8fdd55af
      DEV_BUILD_UUID: 1b594ee5-5ef6-413d-9390-ea7e953a466e
      DEV_DEPLOYMENT_ID: b8bd9578-84ef-4c83-aaf2-43561bd276f2
      DEV_VERSION_ID: 4480647b-a913-47a5-a978-754db4dded81
      BASE_URL: https://ads-operations-web-dev.tanshiyuesir.workers.dev
      STORE_ID: store-dev-01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/265-dev-runtime-readonly-acceptance
          fetch-depth: 0

      - name: Probe exact deployed Development runtime with GET only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "$BASE_URL/api/health" > evidence/health.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "$BASE_URL/assets/cloudflare-native-csv-recommendation-human-review-v1.js" > evidence/human-review-ui.js
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "$BASE_URL/api/v1/stores/$STORE_ID/advisory-reviews?reviewContract=csv-recommendation-human-review-v1&startDate=2026-06-01&endDate=2026-06-30&limit=100" \
            > evidence/human-review.json

      - name: Validate read-only runtime contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const health = JSON.parse(fs.readFileSync('evidence/health.json','utf8'));
          const ui = fs.readFileSync('evidence/human-review-ui.js','utf8');
          const review = JSON.parse(fs.readFileSync('evidence/human-review.json','utf8'));
          const fail = (m) => { throw new Error(m); };

          if (health.ok !== true) fail('dev_health_not_ok');
          if (health.environment !== 'development') fail('dev_environment_mismatch');
          if (health.deployment?.versionId !== process.env.DEV_VERSION_ID) fail('dev_live_version_mismatch');
          if (health.syncTriggerEnabled !== false) fail('dev_sync_trigger_not_disabled');
          if (!ui.includes("const VERSION = '1.5.0';")) fail('human_review_ui_1_5_0_missing');
          if (!ui.includes('Prior Human Review rationale')) fail('historical_rationale_label_missing');
          if (!ui.includes('Historical Human Review context only. This is not current recommendation evidence, effectiveness, execution authority, or Amazon mutation authority.')) fail('historical_rationale_boundary_copy_missing');
          if (!ui.includes("const note = String(context?.latestHistoricalReview?.note || '').trim();")) fail('historical_rationale_projection_missing');
          if (!ui.includes("if (!note) return '';")) fail('blank_rationale_hide_contract_missing');

          if (review.schemaVersion !== 'csv-recommendation-human-review-v1') fail('human_review_schema_mismatch');
          if (review.storeId !== process.env.STORE_ID) fail('human_review_store_mismatch');
          const h = review.historicalLearning;
          if (!h || h.schemaVersion !== 'historical-review-learning-v1') fail('historical_learning_schema_mismatch');
          for (const [key,value] of Object.entries({
            readOnly: true,
            adaptiveLearningAuthorized: false,
            ruleMutationAuthorized: false,
            recommendationMutationAuthorized: false,
            executionAuthorized: false,
            amazonMutationAuthorized: false,
          })) {
            if (h.authority?.[key] !== value) fail(`historical_learning_authority_${key}_mismatch`);
          }
          if (h.semantics?.recurrenceIsEffectiveness !== false) fail('recurrence_effectiveness_boundary_broken');
          if (h.semantics?.approvedMeansExecuted !== false) fail('approved_execution_boundary_broken');
          if (h.semantics?.approvedMeansSuccessful !== false) fail('approved_success_boundary_broken');
          if (h.semantics?.rejectedMeansFailed !== false) fail('rejected_failure_boundary_broken');
          if (h.semantics?.automaticFeedbackIntoRecommendations !== false) fail('automatic_feedback_boundary_broken');

          let latestCount = 0;
          let nonEmptyNoteCount = 0;
          let nullNoteCount = 0;
          for (const context of Array.isArray(h.contexts) ? h.contexts : []) {
            const latest = context?.latestHistoricalReview;
            if (!latest) continue;
            latestCount += 1;
            if (!Object.prototype.hasOwnProperty.call(latest, 'note')) fail('latest_historical_review_note_field_missing');
            if (latest.note === null) {
              nullNoteCount += 1;
            } else if (typeof latest.note === 'string' && latest.note.trim() === latest.note && latest.note.length > 0) {
              nonEmptyNoteCount += 1;
            } else {
              fail('historical_note_shape_invalid');
            }
          }
          if (latestCount < 1) fail('no_live_historical_review_context');
          if (nonEmptyNoteCount < 1) fail('no_live_non_empty_historical_rationale_fixture');

          const evidence = {
            ok: true,
            gate: 'historical-review-rationale-context-v1-dev-read-only',
            targetSha: process.env.TARGET_SHA,
            buildUuid: process.env.DEV_BUILD_UUID,
            deploymentId: process.env.DEV_DEPLOYMENT_ID,
            versionId: health.deployment.versionId,
            environment: health.environment,
            uiVersion: '1.5.0',
            humanReviewSchemaVersion: review.schemaVersion,
            historicalLearningSchemaVersion: h.schemaVersion,
            authority: h.authority,
            semantics: {
              recurrenceIsEffectiveness: h.semantics.recurrenceIsEffectiveness,
              approvedMeansExecuted: h.semantics.approvedMeansExecuted,
              approvedMeansSuccessful: h.semantics.approvedMeansSuccessful,
              rejectedMeansFailed: h.semantics.rejectedMeansFailed,
              automaticFeedbackIntoRecommendations: h.semantics.automaticFeedbackIntoRecommendations,
            },
            historicalContextCount: h.summary?.historicalContextCount ?? null,
            latestHistoricalReviewCount: latestCount,
            nonEmptyHistoricalRationaleCount: nonEmptyNoteCount,
            nullHistoricalRationaleCount: nullNoteCount,
            syncTriggerEnabled: health.syncTriggerEnabled,
            requestMethods: ['GET'],
            runtimeMutationExecuted: false,
            blockers: [],
            uiSha256: crypto.createHash('sha256').update(ui).digest('hex'),
          };
          fs.writeFileSync('evidence/acceptance.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload immutable Dev evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-265-dev-runtime-readonly-acceptance
          path: |
            evidence/acceptance.json
            evidence/health.json
            evidence/human-review.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot workflow from branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/265-dev-runtime-readonly-acceptance.yml
          git commit -m 'Clean #265 Dev runtime acceptance control plane'
          git push origin HEAD:ops/265-dev-runtime-readonly-acceptance
