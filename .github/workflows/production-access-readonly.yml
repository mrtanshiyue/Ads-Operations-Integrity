name: Production Access Readonly

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-access-readonly.yml'

permissions:
  contents: read

jobs:
  access:
    name: Read Production Access machine-auth posture
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read sanitized Access reusable-policy posture
        run: |
          node --input-type=module <<'NODE'
          const API = 'https://api.cloudflare.com/client/v4';
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          if (!accountId || !token) throw new Error('cloudflare_credentials_missing');
          const headers = { accept: 'application/json', authorization: `Bearer ${token}` };
          const read = async (path) => {
            const response = await fetch(`${API}/accounts/${encodeURIComponent(accountId)}${path}`, { headers });
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            return {
              ok: response.ok && body?.success === true,
              status: response.status,
              result: body?.result ?? null,
              resultInfo: body?.result_info ?? null,
              apiErrorCode: body?.errors?.[0]?.code ?? null,
              apiErrorMessage: body?.errors?.[0]?.message ?? null,
            };
          };
          const ruleType = (rule) => {
            if (!rule || typeof rule !== 'object') return 'unknown';
            return ['service_token','any_valid_service_token','email','email_domain','group','everyone','ip','access_group','cloudflare_account_member']
              .find((key) => Object.prototype.hasOwnProperty.call(rule, key)) || Object.keys(rule)[0] || 'unknown';
          };
          const sanitizeLocation = (value) => {
            if (!value) return null;
            try {
              const url = new URL(value);
              return { protocol: url.protocol, host: url.host, pathname: url.pathname, queryKeys: [...url.searchParams.keys()].sort() };
            } catch { return { unparsable: true }; }
          };

          const [appsResponse, tokenResponse, policiesResponse, subdomainResponse] = await Promise.all([
            read('/access/apps?per_page=50&page=1'),
            read('/access/service_tokens?per_page=50&page=1'),
            read('/access/policies?per_page=50&page=1'),
            read('/workers/scripts/ads-operations-web-prod/subdomain'),
          ]);

          const apps = Array.isArray(appsResponse.result) ? appsResponse.result : [];
          const serviceTokens = Array.isArray(tokenResponse.result) ? tokenResponse.result : [];
          const policies = Array.isArray(policiesResponse.result) ? policiesResponse.result : [];
          const healthResponse = await fetch(`https://ads-operations-web-prod.tanshiyuesir.workers.dev/api/health?accessFingerprint=${Date.now()}`, {
            method: 'GET', redirect: 'manual', cache: 'no-store', headers: { accept: 'application/json', 'cache-control': 'no-cache' },
          });
          await healthResponse.arrayBuffer();

          console.log(JSON.stringify({
            schema: 'production-access-readonly-v4',
            accessApi: {
              apps: {
                ok: appsResponse.ok,
                status: appsResponse.status,
                count: apps.length,
                totalCount: appsResponse.resultInfo?.total_count ?? null,
                rows: apps.map((app) => ({
                  id: app.id || null,
                  name: app.name || null,
                  domain: app.domain || null,
                  type: app.type || null,
                  destinations: Array.isArray(app.destinations) ? app.destinations.map((destination) => ({ type: destination?.type || null, workerId: destination?.worker_id || null, uri: destination?.uri || null })) : [],
                  audPresent: Boolean(app.aud),
                })),
              },
              reusablePolicies: {
                ok: policiesResponse.ok,
                status: policiesResponse.status,
                apiErrorCode: policiesResponse.apiErrorCode,
                count: policies.length,
                totalCount: policiesResponse.resultInfo?.total_count ?? null,
                rows: policies.map((policy) => ({
                  id: policy.id || null,
                  name: policy.name || null,
                  decision: policy.decision || null,
                  reusable: policy.reusable === true,
                  appCount: policy.app_count ?? null,
                  includeRuleTypes: Array.isArray(policy.include) ? policy.include.map(ruleType) : [],
                  requireRuleTypes: Array.isArray(policy.require) ? policy.require.map(ruleType) : [],
                  excludeRuleTypes: Array.isArray(policy.exclude) ? policy.exclude.map(ruleType) : [],
                })),
              },
              serviceTokens: {
                ok: tokenResponse.ok,
                status: tokenResponse.status,
                count: serviceTokens.length,
                rows: serviceTokens.map((row) => ({ id: row.id || null, name: row.name || null, duration: row.duration || null, expiresAt: row.expires_at || null })),
              },
            },
            workerSubdomain: {
              ok: subdomainResponse.ok,
              enabled: subdomainResponse.result?.enabled ?? null,
              previewsEnabled: subdomainResponse.result?.previews_enabled ?? null,
            },
            healthFingerprint: {
              status: healthResponse.status,
              contentType: healthResponse.headers.get('content-type'),
              location: sanitizeLocation(healthResponse.headers.get('location')),
              cfAppSessionCookiePresent: /(?:^|[,;]\s*)CF_AppSession=/.test(String(healthResponse.headers.get('set-cookie') || '')),
            },
            cloudflareMutationAttempted: false,
            amazonExecutionAttempted: false,
          }, null, 2));
          NODE
