name: Production Access Readonly

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-access-readonly.yml'

permissions:
  contents: read

jobs:
  access:
    name: Read Production Access machine-auth posture
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve one-click Worker Access application by exact AUD
        run: |
          node --input-type=module <<'NODE'
          const API = 'https://api.cloudflare.com/client/v4';
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          if (!accountId || !token) throw new Error('cloudflare_credentials_missing');
          const headers = { accept: 'application/json', authorization: `Bearer ${token}` };
          const aud = '4cb87cb838507ac2e774cff9fdb6f53c6bbd2bc2db1ab0d9a2d1e04a9e5b1da8';
          const domain = 'ads-operations-web-prod.tanshiyuesir.workers.dev';
          const read = async (path) => {
            const response = await fetch(`${API}/accounts/${encodeURIComponent(accountId)}${path}`, { headers });
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            return {
              ok: response.ok && body?.success === true,
              status: response.status,
              result: body?.result ?? null,
              resultInfo: body?.result_info ?? null,
              apiErrorCode: body?.errors?.[0]?.code ?? null,
              apiErrorMessage: body?.errors?.[0]?.message ?? null,
            };
          };
          const summarizeApps = (response) => {
            const rows = Array.isArray(response.result) ? response.result : [];
            return {
              ok: response.ok,
              status: response.status,
              totalCount: response.resultInfo?.total_count ?? null,
              rows: rows.map((app) => ({
                id: app.id || null,
                name: app.name || null,
                domain: app.domain || null,
                type: app.type || null,
                audMatchesExpected: String(app.aud || '').toLowerCase() === aud,
                destinations: Array.isArray(app.destinations)
                  ? app.destinations.map((destination) => ({
                      type: destination?.type || null,
                      workerId: destination?.worker_id || null,
                      uri: destination?.uri || null,
                    }))
                  : [],
                policyCountEmbedded: Array.isArray(app.policies) ? app.policies.length : null,
              })),
            };
          };
          const audResponse = await read(`/access/apps?aud=${encodeURIComponent(aud)}&per_page=50&page=1`);
          const domainResponse = await read(`/access/apps?domain=${encodeURIComponent(domain)}&exact=true&per_page=50&page=1`);
          const searchResponse = await read(`/access/apps?search=${encodeURIComponent('ads-operations-web-prod')}&per_page=50&page=1`);
          const candidates = [
            ...(Array.isArray(audResponse.result) ? audResponse.result : []),
            ...(Array.isArray(domainResponse.result) ? domainResponse.result : []),
            ...(Array.isArray(searchResponse.result) ? searchResponse.result : []),
          ];
          const unique = [...new Map(candidates.filter((row) => row?.id).map((row) => [row.id, row])).values()];
          const policies = [];
          for (const app of unique) {
            const response = await read(`/access/apps/${encodeURIComponent(app.id)}/policies?per_page=50&page=1`);
            policies.push({
              appId: app.id,
              status: response.status,
              rows: Array.isArray(response.result)
                ? response.result.map((policy) => ({
                    id: policy.id || null,
                    name: policy.name || null,
                    decision: policy.decision || null,
                    precedence: policy.precedence ?? null,
                    includeRuleKeys: Array.isArray(policy.include)
                      ? policy.include.map((rule) => Object.keys(rule || {})[0] || 'unknown')
                      : [],
                    reusable: policy.reusable === true,
                  }))
                : [],
            });
          }
          const healthResponse = await fetch(`https://${domain}/api/health?audResolve=${Date.now()}`, {
            method: 'GET',
            redirect: 'manual',
            cache: 'no-store',
            headers: { accept: 'application/json', 'cache-control': 'no-cache' },
          });
          const location = healthResponse.headers.get('location');
          let kid = null;
          if (location) {
            try { kid = new URL(location).searchParams.get('kid'); } catch {}
          }
          console.log(JSON.stringify({
            schema: 'production-access-aud-resolution-v1',
            expectedAud: aud,
            edgeKidMatchesExpectedAud: String(kid || '').toLowerCase() === aud,
            edgeStatus: healthResponse.status,
            byAud: summarizeApps(audResponse),
            byExactDomain: summarizeApps(domainResponse),
            bySearch: summarizeApps(searchResponse),
            uniqueCandidateCount: unique.length,
            policies,
            cloudflareMutationAttempted: false,
            amazonExecutionAttempted: false,
          }, null, 2));
          NODE
