name: Temporary prepare #333 safety blob

on:
  push:
    branches:
      - prepare-live-runtime-9b99e7aa

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepare-live-runtime-9b99e7aa
          fetch-depth: 0
      - name: Patch bilingual Amazon safety assertion only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/live-current-main-runtime-acceptance.mjs')
          text = path.read_text()
          old = "    assert.match(authorityText || '', /Amazon execution and mutation disabled/i);"
          new = "    assert.match(authorityText || '', /optimization_actions/i);\n    assert.match(\n      authorityText || '',\n      /Amazon execution and mutation disabled|Amazon 执行与变更均禁用/i,\n    );"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one English-only assertion, found {text.count(old)}')
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif 'Amazon 执行与变更均禁用' not in text:
              raise SystemExit('neither old nor bilingual safety assertion found')
          patched = path.read_text()
          for marker in ['CSV ADVISORY ONLY', 'optimization_actions', 'Amazon execution and mutation disabled', 'Amazon 执行与变更均禁用']:
              if marker not in patched:
                  raise SystemExit(f'missing safety marker: {marker}')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'Safety assertion already patched.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/live-current-main-runtime-acceptance.mjs
          git commit -m "test(acceptance): accept canonical bilingual safety copy"
          git push origin HEAD:prepare-live-runtime-9b99e7aa
