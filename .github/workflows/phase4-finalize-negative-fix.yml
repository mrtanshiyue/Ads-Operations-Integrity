name: Phase 4 Finalize Negative Search Fix

on:
  push:
    branches:
      - phase4/query-native-ads-batch2
    paths:
      - '.github/workflows/phase4-finalize-negative-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/query-native-ads-batch2
          fetch-depth: 0

      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/query-native-module-data-v1.js')
          text = path.read_text(encoding='utf-8')
          marker = "  const advancedSearchMatches = (value, query, exact = false) => {"
          helper = """  const negativeTokenPresent = (value, token) => {
            const normalized = lower(token);
            if (!normalized) return false;
            if (/^[a-z0-9]+$/i.test(normalized)) {
              return lower(value).split(/[^a-z0-9]+/i).filter(Boolean).includes(normalized);
            }
            return lower(value).includes(normalized);
          };

"""
          old_predicate = "&& negatives.every(token => !haystack.includes(token));"
          new_predicate = "&& negatives.every(token => !negativeTokenPresent(value, token));"
          if 'const negativeTokenPresent' not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'advanced search marker count={text.count(marker)}')
              text = text.replace(marker, helper + marker, 1)
          if old_predicate in text:
              text = text.replace(old_predicate, new_predicate, 1)
          if new_predicate not in text:
              raise SystemExit('negative predicate was not updated')
          path.write_text(text, encoding='utf-8')
          PY
          node --check assets/query-native-module-data-v1.js
          node scripts/test-progressive-loader.mjs
          node scripts/test-query-native-modules.mjs
          node scripts/test-query-native-ads-trend.mjs

      - name: Commit final fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/phase4-finalize-negative-fix.yml
          git rm -f .github/workflows/phase4-fix-negative-search-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/query-native-module-data-v1.js
          git commit -m 'Fix negative search token boundaries'
          git push origin HEAD:phase4/query-native-ads-batch2
