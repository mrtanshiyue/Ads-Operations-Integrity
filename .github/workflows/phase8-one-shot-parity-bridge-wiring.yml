name: Phase 8 One-shot Parity Bridge Wiring

on:
  push:
    branches:
      - phase8/legacy-parity-read-bridge
    paths:
      - .github/workflows/phase8-one-shot-parity-bridge-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase8/legacy-parity-read-bridge

      - name: Wire parity module to read-only legacy bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          parity = 'assets/bid-governance-parity-audit-v1.js'
          replace_once(parity, "  const AUDIT_VERSION = '1.0.0';", "  const AUDIT_VERSION = '1.0.1';")
          replace_once(
              parity,
              '''  function legacyRows() {\n    if (typeof getBidGovScopedRows !== 'function') {\n      throw auditError(503, '旧 Bid Governance scoped-row 函数不可用，无法进行真实 Legacy 对账');\n    }\n    const rows = getBidGovScopedRows('searchTerm');\n    if (!Array.isArray(rows)) throw auditError(502, '旧 Bid Governance 返回了无效数据');\n    return rows;\n  }''',
              '''  function legacyRows() {\n    const bridge = typeof AdsDashboardApp !== 'undefined'\n      ? AdsDashboardApp?.debug?.getBidGovernanceScopedRowsForParity\n      : null;\n    if (typeof bridge !== 'function') {\n      throw auditError(503, '旧 Bid Governance 只读 Parity bridge 不可用，无法进行真实 Legacy 对账');\n    }\n    const rows = bridge();\n    if (!Array.isArray(rows)) throw auditError(502, '旧 Bid Governance Parity bridge 返回了无效数据');\n    return rows.map(row => ({ ...row }));\n  }''',
          )
          replace_once(
              parity,
              'Legacy Raw getBidGovScopedRows(searchTerm) ↔ TiDB Query。只审计，不自动加载 Raw，不生成调价动作，不改变执行门禁。',
              'Legacy Raw scoped-row parity bridge ↔ TiDB Query。只审计，不自动加载 Raw，不生成调价动作，不改变执行门禁。',
          )

          query = 'assets/private-cloud-query-v1.js'
          replace_once(query, "  const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1.0.0';", "  const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1.0.1';")

          test = 'scripts/test-bid-governance-parity-audit.mjs'
          replace_once(test, "assert.match(source, /const AUDIT_VERSION = '1\\.0\\.0'/);", "assert.match(source, /const AUDIT_VERSION = '1\\.0\\.1'/);")
          replace_once(test, "assert.match(source, /getBidGovScopedRows\\('searchTerm'\\)/);", "assert.match(source, /AdsDashboardApp\\?\\.debug\\?\\.getBidGovernanceScopedRowsForParity/);\nassert.doesNotMatch(source, /\\bgetBidGovScopedRows\\(/);")
          replace_once(test, "vm.runInContext('const getBidGovScopedRows = grain => grain === \"searchTerm\" ? __legacyRows : [];', context);", "vm.runInContext('const AdsDashboardApp = { debug: { getBidGovernanceScopedRowsForParity: () => __legacyRows.map(row => ({ ...row })) } };', context);")
          replace_once(test, "assert.equal(audit.version, '1.0.0');", "assert.equal(audit.version, '1.0.1');")

          progressive = 'scripts/test-progressive-loader.mjs'
          text = Path(progressive).read_text(encoding='utf-8')
          anchor = "const bidIntelligence = readFileSync(new URL('../assets/query-native-bid-intelligence-v1.js', import.meta.url), 'utf8');\n"
          addition = anchor + "const legacyCore = readFileSync(new URL('../assets/generated/inline-script-04.js', import.meta.url), 'utf8');\n"
          if 'const legacyCore =' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('progressive: bid intelligence read anchor not unique')
              text = text.replace(anchor, addition, 1)
          old = "assert.match(query, /const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1\\.0\\.0'/);"
          new = "assert.match(query, /const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1\\.0\\.1'/);"
          if text.count(old) != 1:
              raise SystemExit('progressive: parity version assertion not unique')
          text = text.replace(old, new, 1)
          old = "assert.match(parityAudit, /const AUDIT_VERSION = '1\\.0\\.0'/);\nassert.match(parityAudit, /getBidGovScopedRows\\('searchTerm'\\)/);"
          new = "assert.match(parityAudit, /const AUDIT_VERSION = '1\\.0\\.1'/);\nassert.match(legacyCore, /getBidGovernanceScopedRowsForParity:\\(\\)=>getBidGovScopedRows\\(\"searchTerm\"\\)\\.map\\(row=>\\(\\{\\.\\.\\.row\\}\\)\\)/);\nassert.match(parityAudit, /AdsDashboardApp\\?\\.debug\\?\\.getBidGovernanceScopedRowsForParity/);\nassert.doesNotMatch(parityAudit, /\\bgetBidGovScopedRows\\(/);"
          if text.count(old) != 1:
              raise SystemExit('progressive: parity bridge assertion anchor not unique')
          text = text.replace(old, new, 1)
          Path(progressive).write_text(text, encoding='utf-8')
          PY

          node --check assets/generated/inline-script-04.js
          node --check assets/bid-governance-parity-audit-v1.js
          node --check assets/private-cloud-query-v1.js
          node --check scripts/test-bid-governance-parity-audit.mjs
          node --check scripts/test-progressive-loader.mjs
          node scripts/test-progressive-loader.mjs
          git diff --check

      - name: Commit parity bridge wiring only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bid-governance-parity-audit-v1.js assets/private-cloud-query-v1.js scripts/test-bid-governance-parity-audit.mjs scripts/test-progressive-loader.mjs
          git diff --cached --exit-code -- .github/workflows/phase8-one-shot-parity-bridge-wiring.yml
          git commit -m "Phase 8: wire parity audit to legacy read bridge"
          git push origin HEAD:phase8/legacy-parity-read-bridge
