name: Production Exact Main Build CE5E7D

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-exact-main-build-ce5e7d.yml'

permissions:
  contents: read

jobs:
  build:
    name: Deploy exact current main to Production Web Worker
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/manual-production-build-ce5e7d' &&
      github.event.pull_request.base.sha == 'ce5e7dc4a80f1fcd0806acbc61156b1c682f7467'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: ce5e7dc4a80f1fcd0806acbc61156b1c682f7467
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trigger governed exact-main Production build
        run: |
          node --input-type=module <<'NODE'
          import { discoverWorkerDeploymentTopology } from './scripts/cloudflare-deployment-discovery-client.mjs';
          const API = 'https://api.cloudflare.com/client/v4';
          const accountId = required(process.env.CLOUDFLARE_ACCOUNT_ID, 'account_missing');
          const token = required(process.env.CLOUDFLARE_API_TOKEN, 'token_missing');
          const githubToken = required(process.env.GITHUB_TOKEN, 'github_token_missing');
          const expected = required(process.env.EXPECTED_MAIN_SHA, 'sha_missing').toLowerCase();
          const gh = await fetch('https://api.github.com/repos/mrtanshiyue/Ads-Operations-Integrity/branches/main', { headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${githubToken}` } });
          if (!gh.ok || String((await gh.json())?.commit?.sha || '').toLowerCase() !== expected) throw new Error('main_drift');
          const headers = { accept: 'application/json', authorization: `Bearer ${token}` };
          const get = async (path) => {
            const r = await fetch(`${API}/accounts/${accountId}${path}`, { headers });
            const body = await r.json();
            if (!r.ok || body?.success !== true) throw new Error(`cf_get_failed:${path}:${r.status}`);
            return body.result;
          };
          const workers = await get('/workers/scripts');
          const worker = workers.find((row) => row?.id === 'ads-operations-web-prod');
          if (!worker?.tag) throw new Error('worker_tag_missing');
          const triggers = await get(`/builds/workers/${worker.tag}/triggers`);
          const matches = triggers.filter((row) => row?.trigger_name === 'ads-operations-web-prod exact-main');
          if (matches.length !== 1) throw new Error(`trigger_count_${matches.length}`);
          const trigger = matches[0];
          if (JSON.stringify(trigger.branch_includes || []) !== JSON.stringify(['__manual_exact_main_prod__'])) throw new Error('trigger_governance_drift');
          if (String(trigger.deploy_command || '') !== 'npx wrangler deploy --env production --config cloudflare/runtime/wrangler.native.jsonc') throw new Error('deploy_command_drift');
          const start = await fetch(`${API}/accounts/${accountId}/builds/triggers/${trigger.trigger_uuid}/builds`, {
            method: 'POST', headers: { ...headers, 'content-type': 'application/json' }, body: JSON.stringify({ branch: 'main', commit_hash: expected }),
          });
          const startBody = await start.json();
          if (!start.ok || startBody?.success !== true || !startBody?.result?.build_uuid) throw new Error(`build_start_failed_${start.status}`);
          const buildUuid = startBody.result.build_uuid;
          let outcome = null;
          for (let i = 0; i < 60; i += 1) {
            const build = await get(`/builds/builds/${buildUuid}`);
            outcome = String(build?.build_outcome || '').toLowerCase();
            if (['success','fail','skipped','cancelled','terminated'].includes(outcome)) break;
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (outcome !== 'success') throw new Error(`build_outcome_${outcome || 'timeout'}`);
          let topology = null;
          for (let i = 0; i < 30; i += 1) {
            const candidate = await discoverWorkerDeploymentTopology({ accountId, scriptName: 'ads-operations-web-prod', token });
            if (String(candidate?.activeBuild?.commitSha || '').toLowerCase() === expected && Number(candidate?.activeDeployment?.percentage) === 100) { topology = candidate; break; }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!topology) throw new Error('exact_main_not_active');
          console.log(JSON.stringify({ verified: true, buildUuid, commitSha: topology.activeBuild.commitSha, deploymentId: topology.activeDeployment.deploymentId, versionId: topology.activeVersion.versionId, percentage: topology.activeDeployment.percentage, amazonExecutionAttempted: false }));
          function required(v, code) { const text = String(v || '').trim(); if (!text) throw new Error(code); return text; }
          NODE
