name: Phase 8 Browser CORS Patch

on:
  push:
    branches: [fix/phase8-browser-cors-2026-08-05]
    paths:
      - scripts/phase8-browser-cors-patch.mjs
      - .github/workflows/phase8-browser-cors-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase8-browser-cors-2026-08-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Remove unsupported request header and validate loader
        run: |
          set -euo pipefail
          node scripts/phase8-browser-cors-patch.mjs
          node --check assets/private-cloud-warehouse-v4.js
          grep -Fq "const LOADER_VERSION = '4.2.2'" assets/private-cloud-warehouse-v4.js
          grep -Fq '__warehouseRetry' assets/private-cloud-warehouse-v4.js
          grep -Fq 'maxAttempts: 8' assets/private-cloud-warehouse-v4.js
          ! grep -Fq "headers.set('Cache-Control'" assets/private-cloud-warehouse-v4.js
          ! grep -Eq 'lr_private_cloud_password|sessionStorage|const sessionSafe|getPassword' assets/private-cloud-warehouse-v4.js assets/private-cloud-query-v1.js
          rm scripts/phase8-browser-cors-patch.mjs
          rm .github/workflows/phase8-browser-cors-patch.yml
      - name: Commit browser CORS hotfix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/private-cloud-warehouse-v4.js scripts/phase8-browser-cors-patch.mjs .github/workflows/phase8-browser-cors-patch.yml
          git commit -m "Remove unsupported CORS request header from Loader"
          git push origin HEAD:fix/phase8-browser-cors-2026-08-05
