name: 265 Production runtime read-only acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/265-prod-runtime-readonly-acceptance.yml'

permissions:
  contents: write

jobs:
  accept-prod:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/265-prod-runtime-readonly-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 2669f44813f76c370eed7c0f51378e3f8fdd55af
      PROD_BUILD_UUID: 3f51441f-6247-4d7f-9df9-15a3e712ad1a
      PROD_DEPLOYMENT_ID: 20f470b4-dcbf-4063-8971-34e0c8790292
      PROD_VERSION_ID: e5b4a380-f180-4a1b-8c7d-35f8caf4655b
      BASE_URL: https://ads-operations-web-prod.tanshiyuesir.workers.dev
      STORE_ID: store-01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/265-prod-runtime-readonly-acceptance
          fetch-depth: 0

      - name: Probe Production Access boundary with GET only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          probe() {
            local name="$1"
            local url="$2"
            curl --silent --show-error --retry 3 --retry-all-errors \
              --dump-header "evidence/${name}.headers" \
              --output "evidence/${name}.body" \
              --write-out '%{http_code}' "$url" > "evidence/${name}.status"
          }
          probe health "$BASE_URL/api/health"
          probe ui "$BASE_URL/assets/cloudflare-native-csv-recommendation-human-review-v1.js"
          probe review "$BASE_URL/api/v1/stores/$STORE_ID/advisory-reviews?reviewContract=csv-recommendation-human-review-v1&startDate=2026-06-01&endDate=2026-06-30&limit=1"

      - name: Validate Access intercept and no application-content leak
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const fail = (m) => { throw new Error(m); };

          function inspect(name) {
            const status = Number(fs.readFileSync(`evidence/${name}.status`, 'utf8').trim());
            const headers = fs.readFileSync(`evidence/${name}.headers`, 'utf8');
            const body = fs.readFileSync(`evidence/${name}.body`, 'utf8');
            const location = (headers.match(/^location:\s*(.+)$/im) || [])[1]?.trim() || null;
            const contentType = (headers.match(/^content-type:\s*(.+)$/im) || [])[1]?.trim() || null;
            const accessHtml = /<html[\s>]/i.test(body) && /(cloudflare|access|sign[ -]?in|login)/i.test(body);
            const accessRedirect = [301,302,303,307,308].includes(status) && !!location && /(cloudflareaccess\.com|\/cdn-cgi\/access)/i.test(location);
            const accessStatus = [401,403].includes(status);
            if (!(accessHtml || accessRedirect || accessStatus)) {
              fail(`${name}_not_access_intercepted_status_${status}`);
            }
            return {
              status,
              contentType,
              locationHost: location ? (() => { try { return new URL(location).host; } catch { return null; } })() : null,
              accessHtml,
              accessRedirect,
              accessStatus,
              bodySha256: crypto.createHash('sha256').update(body).digest('hex'),
              body,
            };
          }

          const health = inspect('health');
          const ui = inspect('ui');
          const review = inspect('review');

          if (/"environment"\s*:\s*"production"/i.test(health.body)) fail('production_health_payload_leaked_unauthenticated');
          if (ui.body.includes("const VERSION = '1.5.0';")) fail('production_ui_asset_leaked_unauthenticated');
          if (/"schemaVersion"\s*:\s*"csv-recommendation-human-review-v1"/i.test(review.body)) fail('production_human_review_payload_leaked_unauthenticated');

          const compact = ({ body, ...rest }) => rest;
          const evidence = {
            ok: true,
            gate: 'historical-review-rationale-context-v1-prod-access-read-only',
            targetSha: process.env.TARGET_SHA,
            buildUuid: process.env.PROD_BUILD_UUID,
            deploymentId: process.env.PROD_DEPLOYMENT_ID,
            versionId: process.env.PROD_VERSION_ID,
            productionRuntimeIdentitySource: 'Cloudflare Workers Builds/deployments control-plane evidence recorded in #265',
            accessBoundaryObserved: true,
            probes: {
              health: compact(health),
              uiAsset: compact(ui),
              humanReview: compact(review),
            },
            applicationPayloadExposedUnauthenticated: false,
            authenticatedHumanReviewGetPerformed: false,
            authenticatedReadLimitation: 'No persistent Production operator/service identity is retained for this narrow gate; Access was not weakened and no temporary identity was recreated.',
            devReadOnlyContractAlreadyPassed: true,
            requestMethods: ['GET'],
            runtimeMutationExecuted: false,
            productionDataMutationExecuted: false,
            temporaryIdentityCreated: false,
            accessWeakened: false,
            blockers: [],
          };
          fs.writeFileSync('evidence/acceptance.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload immutable Production evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-265-prod-runtime-readonly-acceptance
          path: evidence/acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot workflow from branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/265-prod-runtime-readonly-acceptance.yml
          git commit -m 'Clean #265 Production runtime acceptance control plane'
          git push origin HEAD:ops/265-prod-runtime-readonly-acceptance
