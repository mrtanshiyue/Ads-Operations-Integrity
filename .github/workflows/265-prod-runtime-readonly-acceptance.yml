name: 265 Production runtime read-only acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/265-prod-runtime-readonly-acceptance.yml'

permissions:
  contents: write

jobs:
  accept-prod:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/265-prod-runtime-readonly-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 2669f44813f76c370eed7c0f51378e3f8fdd55af
      PROD_BUILD_UUID: 3f51441f-6247-4d7f-9df9-15a3e712ad1a
      PROD_DEPLOYMENT_ID: 20f470b4-dcbf-4063-8971-34e0c8790292
      PROD_VERSION_ID: e5b4a380-f180-4a1b-8c7d-35f8caf4655b
      BASE_URL: https://ads-operations-web-prod.tanshiyuesir.workers.dev
      STORE_ID: store-01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/265-prod-runtime-readonly-acceptance
          fetch-depth: 0

      - name: Probe exact deployed Production runtime with GET only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "$BASE_URL/api/health" > evidence/health.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "$BASE_URL/assets/cloudflare-native-csv-recommendation-human-review-v1.js" > evidence/human-review-ui.js
          status="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --output evidence/human-review-unauthenticated.txt --write-out '%{http_code}' \
            "$BASE_URL/api/v1/stores/$STORE_ID/advisory-reviews?reviewContract=csv-recommendation-human-review-v1&startDate=2026-06-01&endDate=2026-06-30&limit=1")"
          printf '%s\n' "$status" > evidence/human-review-unauthenticated-status.txt

      - name: Validate Production read-only runtime and Access boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const health = JSON.parse(fs.readFileSync('evidence/health.json','utf8'));
          const ui = fs.readFileSync('evidence/human-review-ui.js','utf8');
          const unauthStatus = Number(fs.readFileSync('evidence/human-review-unauthenticated-status.txt','utf8').trim());
          const fail = (m) => { throw new Error(m); };

          if (health.ok !== true) fail('prod_health_not_ok');
          if (health.environment !== 'production') fail('prod_environment_mismatch');
          if (health.deployment?.versionId !== process.env.PROD_VERSION_ID) fail('prod_live_version_mismatch');
          if (health.syncTriggerEnabled !== false) fail('prod_sync_trigger_not_disabled');
          if (![401,403].includes(unauthStatus)) fail(`production_human_review_access_not_fail_closed_${unauthStatus}`);

          if (!ui.includes("const VERSION = '1.5.0';")) fail('human_review_ui_1_5_0_missing');
          if (!ui.includes('Prior Human Review rationale')) fail('historical_rationale_label_missing');
          if (!ui.includes('Historical Human Review context only. This is not current recommendation evidence, effectiveness, execution authority, or Amazon mutation authority.')) fail('historical_rationale_boundary_copy_missing');
          if (!ui.includes("const note = String(context?.latestHistoricalReview?.note || '').trim();")) fail('historical_rationale_projection_missing');
          if (!ui.includes("if (!note) return '';")) fail('blank_rationale_hide_contract_missing');

          const evidence = {
            ok: true,
            gate: 'historical-review-rationale-context-v1-prod-read-only',
            targetSha: process.env.TARGET_SHA,
            buildUuid: process.env.PROD_BUILD_UUID,
            deploymentId: process.env.PROD_DEPLOYMENT_ID,
            versionId: health.deployment.versionId,
            environment: health.environment,
            uiVersion: '1.5.0',
            syncTriggerEnabled: health.syncTriggerEnabled,
            unauthenticatedHumanReviewStatus: unauthStatus,
            accessBoundaryObserved: true,
            authenticatedHumanReviewGetPerformed: false,
            authenticatedReadLimitation: 'No persistent Production operator/service identity is retained for this narrow gate; Access was not weakened and no temporary identity was recreated.',
            devAuthenticatedEquivalentContract: false,
            devReadOnlyContractAlreadyPassed: true,
            requestMethods: ['GET'],
            runtimeMutationExecuted: false,
            productionDataMutationExecuted: false,
            temporaryIdentityCreated: false,
            blockers: [],
            uiSha256: crypto.createHash('sha256').update(ui).digest('hex'),
          };
          fs.writeFileSync('evidence/acceptance.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload immutable Production evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-265-prod-runtime-readonly-acceptance
          path: |
            evidence/acceptance.json
            evidence/health.json
            evidence/human-review-unauthenticated-status.txt
            evidence/human-review-unauthenticated.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot workflow from branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/265-prod-runtime-readonly-acceptance.yml
          git commit -m 'Clean #265 Production runtime acceptance control plane'
          git push origin HEAD:ops/265-prod-runtime-readonly-acceptance
