name: Temporary Final Disposition Bootstrap

on:
  push:
    branches:
      - 'feature/human-review-final-disposition-v1'
    paths:
      - '.github/workflows/tmp-final-disposition-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-review-final-disposition-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact final disposition patches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function read(path){ return fs.readFileSync(path,'utf8'); }
          function write(path,value){ fs.writeFileSync(path,value); }
          function once(path, from, to) {
            const src = read(path);
            const first = src.indexOf(from);
            if (first < 0) throw new Error(`anchor missing: ${path}: ${from.slice(0,80)}`);
            if (src.indexOf(from, first + from.length) >= 0) throw new Error(`anchor not unique: ${path}`);
            write(path, src.slice(0, first) + to + src.slice(first + from.length));
          }

          const contract = 'cloudflare/runtime/csv-recommendation-human-review-contract.js';
          once(contract,
`const ADVISORY_STATE_MAP = Object.freeze({
  acknowledged: 'acknowledged',
  needs_review: 'open',
});`,
`const ADVISORY_STATE_MAP = Object.freeze({
  acknowledged: 'acknowledged',
  needs_review: 'open',
  approved: 'approved',
  rejected: 'rejected',
});`);
          once(contract,
` * represents acknowledged / needs_review for search-term candidates only. Session states
 * remain presentation-only. approved / rejected and root-level candidates remain fail-closed
 * until an explicit schema contract exists; they must never be coerced into execution state.`,
` * represents acknowledged / needs_review / approved / rejected for search-term candidates.
 * Session states remain presentation-only. Final dispositions are Human Review outcomes only;
 * they must never be coerced into Optimization Action approval or execution state.`);

          const api = 'cloudflare/runtime/csv-recommendation-human-review-api.js';
          once(api,
`const ALLOWED_REQUEST_STATES = new Set(['acknowledged', 'needs_review']);`,
`const ALLOWED_REQUEST_STATES = new Set(['acknowledged', 'needs_review', 'approved', 'rejected']);`);
          once(api,
`export function persistedStateToUiState(value) {
  if (value === 'acknowledged') return 'acknowledged';
  if (value === 'open') return 'needs_review';
  return null;
}`,
`export function persistedStateToUiState(value) {
  if (value === 'acknowledged') return 'acknowledged';
  if (value === 'open') return 'needs_review';
  if (value === 'approved') return 'approved';
  if (value === 'rejected' || value === 'dismissed') return 'rejected';
  return null;
}`);
          once(api,
`    durableStates: ['acknowledged', 'needs_review'],
    viewedPersistenceSupported: false,
    approvedRejectedPersistenceSupported: false,`,
`    durableStates: ['acknowledged', 'needs_review', 'approved', 'rejected'],
    viewedPersistenceSupported: false,
    approvedRejectedPersistenceSupported: true,
    finalDispositionReviewOnly: true,`);

          const historical = 'cloudflare/runtime/historical-review-learning.js';
          once(historical,
`      needsReviewMeansRejected: false,
      historicalOutcomeAvailable: false,
      automaticFeedbackIntoRecommendations: false,`,
`      needsReviewMeansRejected: false,
      approvedMeansExecuted: false,
      approvedMeansSuccessful: false,
      rejectedMeansFailed: false,
      finalDispositionIsEffectiveness: false,
      historicalOutcomeAvailable: false,
      automaticFeedbackIntoRecommendations: false,`);
          once(historical,
`    acknowledgedCount: stateCounts.acknowledged,
    needsReviewCount: stateCounts.needs_review,
    unsupportedStateCount: stateCounts.unsupported,`,
`    acknowledgedCount: stateCounts.acknowledged,
    needsReviewCount: stateCounts.needs_review,
    approvedCount: stateCounts.approved,
    rejectedCount: stateCounts.rejected,
    unsupportedStateCount: stateCounts.unsupported,`);
          once(historical,
`function historyStateCounts(entries) {
  const counts = { acknowledged: 0, needs_review: 0, unsupported: 0 };
  for (const entry of entries) {
    const review = entry?.review || entry;
    const state = normalizedState(review?.state);
    if (state === 'acknowledged') counts.acknowledged += 1;
    else if (state === 'needs_review') counts.needs_review += 1;
    else counts.unsupported += 1;
  }
  return counts;
}`,
`function historyStateCounts(entries) {
