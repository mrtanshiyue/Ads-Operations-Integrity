name: Patch V4 Canary Origin

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-migration-phase-1
    paths:
      - ".github/canary/v4-origin.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@v4
        with:
          ref: cloud-migration-phase-1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch Worker origin
        run: node scripts/patch-v4-canary-origin.mjs

      - name: Validate external loader syntax
        run: node --check assets/private-cloud-warehouse-v3.js

      - name: Validate origin isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings \
            "https://amazon-ad-private-api-v2.tanshiyuesir.workers.dev" \
            assets/private-cloud-warehouse-v3.js index.html
          grep -q --fixed-strings \
            "https://amazon-warehouse-cloud-v4.tanshiyuesir.workers.dev" \
            assets/private-cloud-warehouse-v3.js
          grep -q --fixed-strings \
            "https://amazon-warehouse-cloud-v4.tanshiyuesir.workers.dev" \
            index.html

      - name: Commit canary patch and diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/private-cloud-warehouse-v3.js index.html .diagnostics/cloud-v4-canary-origin.json
          if ! git diff --cached --quiet; then
            git commit -m "Point front-end canary to Cloud Warehouse V4"
            git pull --rebase origin cloud-migration-phase-1
            git push origin HEAD:cloud-migration-phase-1
          fi
