name: Temporary Ops Health Final Disposition Compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-ops-health-final-disposition-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/human-review-final-disposition-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-review-final-disposition-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch exact compatibility assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-operations-health-console-contract.mjs')
          text = path.read_text()
          old = """  needsReviewCount: 1,
  acknowledgedCount: 1,
  staleReviewEvidenceCount: 1,"""
          new = """  needsReviewCount: 1,
  acknowledgedCount: 1,
  approvedCount: 0,
  rejectedCount: 0,
  resolvedCount: 0,
  staleReviewEvidenceCount: 1,"""
          if text.count(old) != 1:
              raise SystemExit('operations-health final-disposition anchor missing or non-unique')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate Operations Health canonical compatibility
        run: node scripts/test-operations-health-console-contract.mjs
      - name: Commit compatibility test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-operations-health-console-contract.mjs
          git commit -m 'test: align operations health with final disposition counts'
          git push origin HEAD:feature/human-review-final-disposition-v1
