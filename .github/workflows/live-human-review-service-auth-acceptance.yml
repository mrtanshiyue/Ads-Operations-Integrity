name: Live Human Review Service Auth Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/live-human-review-service-auth-acceptance.mjs'
      - '.github/workflows/live-human-review-service-auth-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-human-review-service-auth-acceptance
  cancel-in-progress: false

jobs:
  production-human-review:
    name: Production Human Review service-auth acceptance
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/access-service-token-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 19cd528b5c32e8da423da3cf66a9f05d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_MAIN_SHA: 535552f760dd9f94befc019a61f90b5f5ca145cb
      PROD_TRIGGER_UUID: fa90d482-de7b-466b-9ada-04404569ede9
      PROD_BASE_URL: https://ads-operations-web-prod.tanshiyuesir.workers.dev
      PROD_CONTROL_DB_ID: 2122248c-1fd4-4ccd-b611-9f9d2f3decbf
      PROD_STORE01_DB_ID: 2e53bbad-5680-431c-bcf7-68e89b231ea1
      OLD_PROD_VERSION: 7fd1413e-ff8d-4870-a5af-de44f6940210
    steps:
      - name: Checkout acceptance harness branch
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run ephemeral service-auth acceptance
        run: node scripts/live-human-review-service-auth-acceptance.mjs

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-human-review-service-auth-acceptance-${{ github.run_id }}
          path: artifacts/live-human-review-service-auth-acceptance/receipt.json
          if-no-files-found: error
          retention-days: 90
