name: Phase 4 Query-native Ads Trend Patch

on:
  push:
    branches: [phase4/query-native-ads-batch2]
    paths:
      - "tools/phase4_patch_query_native_ads_trend.py"
      - ".github/workflows/phase4-query-native-ads-trend-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Query-native ads trend patch
        run: python3 tools/phase4_patch_query_native_ads_trend.py
      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/query-native-module-data-v1.js
          node --check assets/query-native-ads-trend-v1.js
          node --check assets/generated/inline-script-04.js
          node --check scripts/test-query-native-modules.mjs
          node --check scripts/test-query-native-ads-trend.mjs
          node scripts/test-progressive-loader.mjs
          node scripts/test-query-native-modules.mjs
          node scripts/test-query-native-ads-trend.mjs
          grep -Fq 'assets/query-native-module-data-v1.js?v=1.1.0' index.html
          grep -Fq 'assets/query-native-ads-trend-v1.js?v=1.0.0' index.html
      - name: Commit patched production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/generated/inline-script-04.js
          git commit -m "Make ads trend Query-native"
          git push origin HEAD:phase4/query-native-ads-batch2
