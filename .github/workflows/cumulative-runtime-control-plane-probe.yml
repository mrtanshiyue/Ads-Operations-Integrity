name: Cumulative Runtime Development Promotion Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cumulative-runtime-control-plane-probe.yml'

permissions:
  contents: read

concurrency:
  group: cumulative-runtime-development-promotion-acceptance
  cancel-in-progress: false

jobs:
  development-promotion-acceptance:
    name: Development exact-main promotion and cumulative acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 19cd528b5c32e8da423da3cf66a9f05d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      EXPECTED_MAIN_SHA: 980631da32e88ecf0a31c89f2a41a8bacb430775
      DEV_WORKER: ads-operations-web-dev
      PROD_SYNC_WORKER: ads-operations-sync-prod
      DEV_BASE_URL: https://ads-operations-web-dev.tanshiyuesir.workers.dev
    steps:
      - name: Require dedicated acceptance credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'acceptance credential missing'; exit 1; }

      - name: Promote exact canonical main to Development Web
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          json=(-H 'Content-Type: application/json')

          current_main="$(curl -fsS 'https://api.github.com/repos/mrtanshiyue/Ads-Operations-Integrity/branches/main' | jq -r '.commit.sha')"
          test "$current_main" = "$EXPECTED_MAIN_SHA" || { echo "canonical main drifted: $current_main"; exit 1; }

          workers="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          printf '%s' "$workers" | jq -e '.success == true' >/dev/null
          dev_tag="$(printf '%s' "$workers" | jq -er --arg n "$DEV_WORKER" '.result[] | select(.id == $n) | .tag')"

          triggers="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/workers/$dev_tag/triggers")"
          printf '%s' "$triggers" | jq -e '.success == true and (.result | length) == 1' >/dev/null
          trigger_uuid="$(printf '%s' "$triggers" | jq -er '.result[0].trigger_uuid')"
          build_command="$(printf '%s' "$triggers" | jq -r '.result[0].build_command // ""')"
          deploy_command="$(printf '%s' "$triggers" | jq -r '.result[0].deploy_command // ""')"
          printf '%s\n%s\n' "$build_command" "$deploy_command" | grep -Eiq 'sync|wrangler\.sync' && { echo 'Refusing trigger containing Sync deployment semantics'; exit 1; } || true
          test -n "$deploy_command" || { echo 'Development trigger has no deploy command'; exit 1; }

          baseline_deployments="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DEV_WORKER/deployments")"
          printf '%s' "$baseline_deployments" | jq -e '.success == true and (.result.deployments | length) > 0' >/dev/null
          baseline_deployment="$(printf '%s' "$baseline_deployments" | jq -er '.result.deployments[0].id')"
          baseline_version="$(printf '%s' "$baseline_deployments" | jq -er '.result.deployments[0].versions[0].version_id')"

          body="$(jq -cn --arg branch main --arg sha "$EXPECTED_MAIN_SHA" '{branch:$branch,commit_hash:$sha}')"
          create="$(curl -fsS -X POST "${auth[@]}" "${json[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/triggers/$trigger_uuid/builds")"
          printf '%s' "$create" | jq -e '.success == true and (.result.build_uuid | length) > 0' >/dev/null
          build_uuid="$(printf '%s' "$create" | jq -er '.result.build_uuid')"
          echo "BUILD_UUID=$build_uuid"

          build=''
          for _ in $(seq 1 72); do
            build="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/builds/$build_uuid")"
            printf '%s' "$build" | jq -e '.success == true' >/dev/null
            status="$(printf '%s' "$build" | jq -r '.result.status // ""')"
            outcome="$(printf '%s' "$build" | jq -r '.result.build_outcome // ""')"
            if [ "$status" = stopped ]; then break; fi
            sleep 5
          done
          printf '%s' "$build" | jq -e --arg sha "$EXPECTED_MAIN_SHA" '.result.status == "stopped" and .result.build_outcome == "success" and .result.build_trigger_metadata.branch == "main" and .result.build_trigger_metadata.commit_hash == $sha' >/dev/null

          latest=''
          for _ in $(seq 1 36); do
            latest="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DEV_WORKER/deployments")"
            printf '%s' "$latest" | jq -e '.success == true and (.result.deployments | length) > 0' >/dev/null
            new_deployment="$(printf '%s' "$latest" | jq -er '.result.deployments[0].id')"
            if [ "$new_deployment" != "$baseline_deployment" ]; then break; fi
            sleep 5
          done
          new_deployment="$(printf '%s' "$latest" | jq -er '.result.deployments[0].id')"
          new_version="$(printf '%s' "$latest" | jq -er '.result.deployments[0].versions[0].version_id')"
          test "$new_deployment" != "$baseline_deployment"
          test "$new_version" != "$baseline_version"

          settings="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DEV_WORKER/settings")"
          schedules="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DEV_WORKER/schedules")"
          printf '%s' "$settings" | jq -e '.success == true' >/dev/null
          printf '%s' "$schedules" | jq -e '.success == true and (.result.schedules | length) == 0' >/dev/null
          printf '%s' "$settings" | jq -e '.result.bindings | map(select(.name == "SYNC_TRIGGER_ENABLED" and .text == "false")) | length == 1' >/dev/null
          printf '%s' "$settings" | jq -e '.result.bindings | map(select(.name == "PHASE5_SINGLE_RUN_PERMIT_ID" and .text == "")) | length == 1' >/dev/null
          printf '%s' "$settings" | jq -e '.result.bindings | map(select(.name == "PHASE5_SINGLE_RUN_REPORT_DATE" and .text == "")) | length == 1' >/dev/null

          sync_deployments="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_SYNC_WORKER/deployments")"
          sync_settings="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_SYNC_WORKER/settings")"
          sync_schedules="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_SYNC_WORKER/schedules")"
          printf '%s' "$sync_deployments" | jq -e '.success == true and .result.deployments[0].id == "cf0b0adf-96dc-437d-8298-15af58f992ce" and .result.deployments[0].versions[0].version_id == "295df84e-2103-4858-9895-49f67d4b10b4"' >/dev/null
          printf '%s' "$sync_settings" | jq -e '.success == true and (.result.bindings | map(select(.name == "AMAZON_ADS_ENABLED" and .text == "false")) | length == 1)' >/dev/null
          printf '%s' "$sync_schedules" | jq -e '.success == true and (.result.schedules | length) == 0' >/dev/null

          printf '%s\n' "DEV_TAG=$dev_tag" "DEV_TRIGGER_UUID=$trigger_uuid" "BASELINE_DEPLOYMENT=$baseline_deployment" "BASELINE_VERSION=$baseline_version" "NEW_DEPLOYMENT=$new_deployment" "NEW_VERSION=$new_version" >> "$GITHUB_ENV"

          mkdir -p artifacts/cumulative-runtime-development-acceptance
          jq -n \
            --arg schemaVersion cumulative-runtime-development-promotion-v1 \
            --arg expectedMain "$EXPECTED_MAIN_SHA" \
            --arg buildUuid "$build_uuid" \
            --arg triggerUuid "$trigger_uuid" \
            --arg baselineDeployment "$baseline_deployment" \
            --arg baselineVersion "$baseline_version" \
            --arg deployment "$new_deployment" \
            --arg version "$new_version" \
            '{schemaVersion:$schemaVersion,expectedMain:$expectedMain,buildUuid:$buildUuid,triggerUuid:$triggerUuid,baselineDeployment:$baselineDeployment,baselineVersion:$baselineVersion,deployment:$deployment,version:$version,buildOutcome:"success",syncTriggerEnabled:false,productionSyncUntouched:true,amazonAdsEnabled:false}' \
            > artifacts/cumulative-runtime-development-acceptance/promotion.json

      - name: Validate cumulative Development runtime contract
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          json=(-H 'Content-Type: application/json')

          health="$(curl -fsS "$DEV_BASE_URL/api/health")"
          printf '%s' "$health" | jq -e --arg v "$NEW_VERSION" '.ok == true and .environment == "development" and .syncTriggerEnabled == false and .deployment.versionId == $v' >/dev/null

          settings="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DEV_WORKER/settings")"
          control_db="$(printf '%s' "$settings" | jq -er '.result.bindings[] | select(.name == "CONTROL_DB") | .database_id')"
          store01_db="$(printf '%s' "$settings" | jq -er '.result.bindings[] | select(.name == "STORE_01_DB") | .database_id')"

          d1_query() {
            local db="$1" sql="$2" payload
            payload="$(jq -cn --arg sql "$sql" '{sql:$sql}')"
            curl -fsS -X POST "${auth[@]}" "${json[@]}" --data "$payload" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/query"
          }

          store_row="$(d1_query "$control_db" "SELECT store_id, store_code FROM stores WHERE d1_binding_key='STORE_01_DB' AND status <> 'disabled' LIMIT 1")"
          printf '%s' "$store_row" | jq -e '.success == true and (.result[0].results | length) == 1' >/dev/null
          store_id="$(printf '%s' "$store_row" | jq -er '.result[0].results[0].store_id')"

          count_sql="SELECT (SELECT COUNT(*) FROM advisory_review_records) AS advisory_review_records, (SELECT COUNT(*) FROM optimization_actions) AS optimization_actions, (SELECT COUNT(*) FROM optimization_execution_receipts) AS optimization_execution_receipts, (SELECT COUNT(*) FROM sync_runs) AS sync_runs"
          before="$(d1_query "$store01_db" "$count_sql")"
          printf '%s' "$before" | jq -e '.success == true' >/dev/null
          before_counts="$(printf '%s' "$before" | jq -c '.result[0].results[0]')"

          review_url="$DEV_BASE_URL/api/v1/stores/$store_id/advisory-reviews?reviewContract=csv-recommendation-human-review-v1&startDate=2026-06-01&endDate=2026-06-01&limit=50&sort=cost"
          review="$(curl -fsS -H 'Accept: application/json' "$review_url")"
          printf '%s' "$review" | jq -e --arg sid "$store_id" '
            .schemaVersion == "csv-recommendation-human-review-v1" and
            .storeId == $sid and
            .authority.executionAuthorized == false and
            .authority.amazonMutationAuthorized == false and
            (.items | type == "array") and
            (all(.items[]; .decisionPacket.schemaVersion == "recommendation-decision-packet-v1" and .decisionPacket.authority.readOnly == true and .decisionPacket.authority.executionAuthorized == false and .decisionPacket.authority.amazonMutationAuthorized == false)) and
            .candidateLibrary.schemaVersion == "governed-keyword-negative-candidate-library-v1" and
            .candidateLibrary.authority.readOnly == true and
            .candidateLibrary.authority.executionAuthorized == false and
            .candidateLibrary.authority.amazonMutationAuthorized == false and
            .historicalLearning.schemaVersion == "historical-review-learning-v1" and
            .historicalLearning.authority.readOnly == true and
            .historicalLearning.authority.adaptiveLearningAuthorized == false and
            .historicalLearning.authority.ruleMutationAuthorized == false and
            .historicalLearning.authority.recommendationMutationAuthorized == false and
            .historicalLearning.authority.executionAuthorized == false and
            .historicalLearning.authority.amazonMutationAuthorized == false and
            (all(.historicalLearning.contexts[]; if .currentCandidateActive == true then (.currentFingerprint != null and .currentReviewState != null and (.currentEvidenceDrift | type) == "boolean") else (.currentFingerprint == null and .currentReviewState == null and .currentMatchedRecordCount == null and .staleEvidenceCount == null and .currentEvidenceDrift == null) end))
          ' >/dev/null

          asset="$(curl -fsS "$DEV_BASE_URL/assets/cloudflare-native-csv-recommendation-human-review-v1.js")"
          printf '%s' "$asset" | grep -Fq "const VERSION = '1.3.0';"
          printf '%s' "$asset" | grep -Fq "const DECISION_PACKET_VERSION = 'recommendation-decision-packet-v1';"
          printf '%s' "$asset" | grep -Fq "const CANDIDATE_LIBRARY_VERSION = 'governed-keyword-negative-candidate-library-v1';"
          printf '%s' "$asset" | grep -Fq "const HISTORICAL_LEARNING_VERSION = 'historical-review-learning-v1';"

          after="$(d1_query "$store01_db" "$count_sql")"
          printf '%s' "$after" | jq -e '.success == true' >/dev/null
          after_counts="$(printf '%s' "$after" | jq -c '.result[0].results[0]')"
          test "$before_counts" = "$after_counts" || { echo "Business table counts changed: $before_counts -> $after_counts"; exit 1; }

          mkdir -p artifacts/cumulative-runtime-development-acceptance
          printf '%s' "$review" | jq '{schemaVersion,storeId,authority,itemCount:(.items|length),candidateLibrary:{schemaVersion,status,summary,authority},historicalLearning:{schemaVersion,summary,authority,semantics,currentContextCount:([.contexts[]|select(.currentCandidateActive==true)]|length),historicalOnlyContextCount:([.contexts[]|select(.currentCandidateActive!=true)]|length)}}' > artifacts/cumulative-runtime-development-acceptance/runtime.json
          jq -n --argjson before "$before_counts" --argjson after "$after_counts" '{before:$before,after:$after,unchanged:($before==$after)}' > artifacts/cumulative-runtime-development-acceptance/d1-differential.json
          echo "DEV_STORE_ID=$store_id" >> "$GITHUB_ENV"
          echo 'DEVELOPMENT_CUMULATIVE_ACCEPTANCE=PASS'
          echo 'AMAZON_REQUESTS=0'

      - name: Upload Development promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-runtime-development-acceptance-${{ github.run_id }}
          path: artifacts/cumulative-runtime-development-acceptance/
          if-no-files-found: error
          retention-days: 90
