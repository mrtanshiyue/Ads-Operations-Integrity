name: Cumulative Runtime Production Promotion Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cumulative-runtime-control-plane-probe.yml'
      - 'scripts/live-cumulative-runtime-prod-acceptance.mjs'

permissions:
  contents: read

concurrency:
  group: cumulative-runtime-production-promotion-acceptance
  cancel-in-progress: false

jobs:
  production-promotion-acceptance:
    name: Production exact-main promotion and cumulative acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 19cd528b5c32e8da423da3cf66a9f05d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      EXPECTED_MAIN_SHA: 980631da32e88ecf0a31c89f2a41a8bacb430775
      EXPECTED_DEV_VERSION: 7aae4c95-9226-4723-9d1f-201091c92423
      DEV_BASE_URL: https://ads-operations-web-dev.tanshiyuesir.workers.dev
      PROD_BASE_URL: https://ads-operations-web-prod.tanshiyuesir.workers.dev
      PROD_WORKER: ads-operations-web-prod
      PROD_SYNC_WORKER: ads-operations-sync-prod
      PROD_ACCESS_APP_ID: 499b5470-a257-4aec-9ede-7c3a460a42a4
      PROD_ACCESS_AUD: 4cb87cb838507ac2e774cff9fdb6f53c6bbd2bc2db1ab0d9a2d1e04a9e5b1da8
    steps:
      - name: Checkout acceptance-only branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require dedicated acceptance credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'acceptance credential missing'; exit 1; }

      - name: Syntax-check cumulative Production harness
        run: |
          node --check scripts/live-cumulative-runtime-prod-acceptance.mjs
          node --check scripts/cloudflare-d1-rest-adapter.mjs

      - name: Promote exact main and run cumulative Production acceptance
        run: node scripts/live-cumulative-runtime-prod-acceptance.mjs

      - name: Upload immutable Production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-runtime-production-acceptance-${{ github.run_id }}
          path: artifacts/cumulative-runtime-production-acceptance/
          if-no-files-found: warn
          retention-days: 90
