name: '#276 Final Human Review Rationale Runtime Gate — NEVER MERGE'

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/issue-276-final-runtime-acceptance.mjs'
      - '.github/workflows/276-final-runtime-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: issue-276-final-runtime-acceptance
  cancel-in-progress: false

jobs:
  final-runtime-gate:
    name: '#276 exact-main Dev → Production rationale acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: 67b1a1daf403b971006bdd8aa66d6336a5e56832
      CLOUDFLARE_ACCOUNT_ID: 19cd528b5c32e8da423da3cf66a9f05d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      ACCEPTANCE_CREDENTIAL_PRESENT: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN != '' }}
    steps:
      - name: Checkout NEVER-MERGE acceptance harness
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require dedicated acceptance credential
        if: env.ACCEPTANCE_CREDENTIAL_PRESENT != 'true'
        run: |
          echo 'BLOCKED_BY_CLOUDFLARE_ACCEPTANCE_CREDENTIAL_MISSING'
          exit 1

      - name: Pin protected canonical main
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$ACTUAL_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "canonical_main_drift expected=$EXPECTED_MAIN_SHA actual=$ACTUAL_SHA"
            exit 1
          }

      - name: Static harness check
        run: node --check scripts/issue-276-final-runtime-acceptance.mjs

      - name: Run exact-main runtime gate
        run: node scripts/issue-276-final-runtime-acceptance.mjs

      - name: Upload immutable #276 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-276-final-runtime-acceptance-${{ github.run_id }}
          path: artifacts/issue-276-final-runtime-acceptance/receipt.json
          if-no-files-found: warn
          retention-days: 90
