name: Inventory Front-end Security Batch 2

on:
  push:
    branches:
      - fix/frontend-security-batch2-2026-08-05
    paths:
      - index.html
      - assets/**
      - .github/workflows/security-inventory-batch2.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect CSP, runtime dependencies and fallback code
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const loader = readFileSync('assets/private-cloud-warehouse-v4.js', 'utf8');
          const csp = [...html.matchAll(/<meta[^>]+http-equiv=["']Content-Security-Policy["'][^>]+content=["']([^"']*)["'][^>]*>/gi)].map(match => match[1]);
          const scripts = [...html.matchAll(/<script\b([^>]*)>/gi)].map((match, index) => {
            const attrs = match[1];
            const src = attrs.match(/\bsrc=["']([^"']+)["']/i)?.[1] || null;
            const integrity = attrs.match(/\bintegrity=["']([^"']+)["']/i)?.[1] || null;
            return { index, src, integrity, inline: !src };
          });
          const styles = [...html.matchAll(/<style\b[^>]*>/gi)].length;
          const context = (index, radius = 220) => html.slice(Math.max(0, index - radius), Math.min(html.length, index + radius)).replace(/\s+/g, ' ');
          const dynamicContexts = [...html.matchAll(/createElement\s*\(\s*["']script["']\s*\)/g)].map(match => context(match.index));
          const onerrorContexts = [...html.matchAll(/\bonerror\s*=/gi)].map(match => context(match.index));
          const javascriptUrls = [...new Set([...html.matchAll(/https:\/\/[^\s"'<>]+\.js(?:\?[^\s"'<>]*)?/gi)].map(match => match[0]))].sort();
          const vendorUrls = [
            'https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js',
            'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',
            'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',
            'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js',
            'https://cdn.jsdelivr.net/npm/idb-keyval@6.2.1/dist/umd.js',
            'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',
          ];
          const vendorDigests = [];
          for (const url of vendorUrls) {
            const response = await fetch(url, { redirect: 'follow' });
            if (!response.ok) throw new Error(`Vendor fetch failed ${response.status}: ${url}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            vendorDigests.push({
              url,
              finalUrl: response.url,
              bytes: bytes.length,
              sha256: createHash('sha256').update(bytes).digest('hex'),
              sri: `sha384-${createHash('sha384').update(bytes).digest('base64')}`,
            });
          }
          const result = {
            generatedAt: new Date().toISOString(),
            csp,
            scripts,
            inlineScriptCount: scripts.filter(item => item.inline).length,
            inlineStyleCount: styles,
            externalHosts: [...new Set(scripts.filter(item => item.src).map(item => new URL(item.src, 'https://example.invalid').hostname))],
            dynamicScriptCreationCount: dynamicContexts.length,
            dynamicContexts,
            scriptOnErrorCount: onerrorContexts.length,
            onerrorContexts,
            javascriptUrls,
            sessionStorageReferences: (html.match(/sessionStorage/g) || []).length + (loader.match(/sessionStorage/g) || []).length,
            credentialKeyReferences: (html.match(/lr_private_cloud_password/g) || []).length + (loader.match(/lr_private_cloud_password/g) || []).length,
            vendorDigests,
          };
          writeFileSync('security-inventory-batch2.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify({
            cspCount: csp.length,
            scriptCount: scripts.length,
            externalScriptCount: scripts.filter(item => item.src).length,
            inlineScriptCount: result.inlineScriptCount,
            inlineStyleCount: result.inlineStyleCount,
            dynamicScriptCreationCount: result.dynamicScriptCreationCount,
            scriptOnErrorCount: result.scriptOnErrorCount,
            javascriptUrlCount: javascriptUrls.length,
            sessionStorageReferences: result.sessionStorageReferences,
            vendorFiles: vendorDigests.length,
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: security-inventory-batch2-${{ github.run_id }}
          path: security-inventory-batch2.json
          retention-days: 7
