name: Phase 4 Negative Search Boundary Fix

on:
  push:
    branches: [phase4/query-native-ads-batch2]
    paths:
      - "tools/phase4_fix_negative_search_boundary.py"
      - ".github/workflows/phase4-fix-negative-boundary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch commit without Marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_REF"
          git checkout -B phase4/query-native-ads-batch2 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply and validate boundary fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/phase4_fix_negative_search_boundary.py
          node --check assets/query-native-module-data-v1.js
          node scripts/test-progressive-loader.mjs
          node scripts/test-query-native-modules.mjs
          node scripts/test-query-native-ads-trend.mjs

      - name: Commit adapter fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/query-native-module-data-v1.js
          git commit -m "Use token boundaries for negative search filters"
          git push origin HEAD:phase4/query-native-ads-batch2
