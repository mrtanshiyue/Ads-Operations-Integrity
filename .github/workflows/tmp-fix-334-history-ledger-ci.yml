name: Temporary #334 History Ledger CI Contract Fix

on:
  push:
    branches:
      - fix/csv-history-ledger-reentrant-global

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/csv-history-ledger-reentrant-global
          fetch-depth: 0
      - name: Apply narrow #334 packaging and contract fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'scripts/enforce-cloudflare-native-asset-allowlist.mjs',
              "  'cloudflare-native-csv-history-ledger-v1.js',\n",
              "  'cloudflare-native-csv-history-ledger-v1.js',\n  'cloudflare-native-csv-history-ledger-impl-v1.js',\n",
          )

          replace_once(
              'scripts/test-csv-history-ledger-contract.mjs',
              "const uiRelative = 'assets/cloudflare-native-csv-history-ledger-v1.js';\n",
              "const uiPublicRelative = 'assets/cloudflare-native-csv-history-ledger-v1.js';\nconst uiRelative = 'assets/cloudflare-native-csv-history-ledger-impl-v1.js';\n",
          )
          replace_once(
              'scripts/test-csv-history-ledger-contract.mjs',
              "const uiSource = await readFile(path.join(distRoot, uiRelative), 'utf8');\n",
              "const uiPublicSource = await readFile(path.join(distRoot, uiPublicRelative), 'utf8');\nconst uiSource = await readFile(path.join(distRoot, uiRelative), 'utf8');\n",
          )
          replace_once(
              'scripts/test-csv-history-ledger-contract.mjs',
              "assert.ok(indexSource.indexOf(historyTag) < indexSource.indexOf(provenanceTag), 'History ledger must load before provenance audit');\n",
              "assert.ok(indexSource.indexOf(historyTag) < indexSource.indexOf(provenanceTag), 'History ledger must load before provenance audit');\nassert.match(uiPublicSource, /export \\* from '\\.\\/cloudflare-native-csv-history-ledger-impl-v1\\.js';/, 'History ledger public path must remain a thin canonical implementation wrapper');\n",
          )
          replace_once(
              'scripts/test-csv-history-ledger-contract.mjs',
              "assert.equal(pattern.test(`${engineSource}\\n${uiSource}`), false, `History ledger must remain transport/storage/execution free: ${pattern}`);",
              "assert.equal(pattern.test(`${engineSource}\\n${uiPublicSource}\\n${uiSource}`), false, `History ledger must remain transport/storage/execution free: ${pattern}`);",
          )

          replace_once(
              'scripts/test-csv-history-ledger-module-identity.mjs',
              "const publicPath = path.join(repoRoot, 'assets/cloudflare-native-csv-history-ledger-v1.js');\nconst implementationPath = path.join(repoRoot, 'assets/cloudflare-native-csv-history-ledger-impl-v1.js');\nconst indexPath = path.join(repoRoot, 'index.html');\n",
              "const distRoot = path.join(repoRoot, 'dist-cloudflare-native');\nconst publicPath = path.join(distRoot, 'assets/cloudflare-native-csv-history-ledger-v1.js');\nconst implementationPath = path.join(distRoot, 'assets/cloudflare-native-csv-history-ledger-impl-v1.js');\nconst indexPath = path.join(distRoot, 'index.html');\n",
          )
          PY

          git diff --check
          git status --short
      - name: Commit and push narrow fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/enforce-cloudflare-native-asset-allowlist.mjs \
                  scripts/test-csv-history-ledger-contract.mjs \
                  scripts/test-csv-history-ledger-module-identity.mjs
          git commit -m "test(csv): align history ledger canonical packaging contracts"
          git push origin HEAD:fix/csv-history-ledger-reentrant-global
