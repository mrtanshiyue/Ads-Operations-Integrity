name: '#276 Dev Workers Versions Read-only Diagnostic — NEVER MERGE'

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/276-dev-versions-readonly-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: '#276 GET-only Dev versions/settings inspection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 19cd528b5c32e8da423da3cf66a9f05d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      WORKER: ads-operations-web-dev
    steps:
      - name: Inspect versions, active deployment and selected bindings with GET only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const worker = process.env.WORKER;
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          async function get(path) {
            const r = await fetch(`${api}${path}`, { headers: { authorization: `Bearer ${token}`, accept: 'application/json' } });
            const j = await r.json().catch(() => ({}));
            if (!r.ok || j?.success === false) throw new Error(`${path}:${r.status}:${j?.errors?.[0]?.message || ''}`);
            return j.result;
          }
          const wanted = new Set(['ACCESS_MODE','SYNC_TRIGGER_ENABLED','PHASE5_SINGLE_RUN_PERMIT_ID','PHASE5_SINGLE_RUN_REPORT_DATE']);
          function collectBindings(value, out = []) {
            if (!value || typeof value !== 'object') return out;
            if (Array.isArray(value)) {
              for (const item of value) {
                if (item && typeof item === 'object' && wanted.has(item.name)) {
                  out.push({ name: item.name, type: item.type ?? null, text: item.text ?? item.value ?? null });
                }
                collectBindings(item, out);
              }
              return out;
            }
            for (const child of Object.values(value)) collectBindings(child, out);
            return out;
          }
          function versionRows(result) {
            if (Array.isArray(result)) return result;
            for (const key of ['items','versions','results']) if (Array.isArray(result?.[key])) return result[key];
            return [];
          }
          const deployments = await get(`/workers/scripts/${encodeURIComponent(worker)}/deployments`);
          const depRows = deployments?.deployments || (Array.isArray(deployments) ? deployments : []);
          const active = depRows[0] || null;
          const activeVersion = active?.versions?.find(v => Number(v?.percentage) === 100)?.version_id || active?.versions?.[0]?.version_id || null;
          const settings = await get(`/workers/scripts/${encodeURIComponent(worker)}/settings`);
          const versionsRaw = await get(`/workers/scripts/${encodeURIComponent(worker)}/versions?per_page=20`);
          const rows = versionRows(versionsRaw);
          const summaries = [];
          for (const row of rows.slice(0, 12)) {
            const id = row?.id || row?.version_id || row?.uuid || null;
            let detail = null;
            if (id) detail = await get(`/workers/scripts/${encodeURIComponent(worker)}/versions/${encodeURIComponent(id)}`).catch(e => ({ diagnosticError: e.message }));
            summaries.push({
              id,
              number: row?.number ?? detail?.number ?? null,
              createdOn: row?.metadata?.created_on ?? row?.created_on ?? detail?.metadata?.created_on ?? detail?.created_on ?? null,
              annotations: row?.annotations ?? detail?.annotations ?? row?.metadata?.annotations ?? detail?.metadata?.annotations ?? null,
              selectedBindings: collectBindings(detail),
              rowKeys: row && typeof row === 'object' ? Object.keys(row).sort() : [],
              detailKeys: detail && typeof detail === 'object' ? Object.keys(detail).sort() : [],
            });
          }
          console.log(JSON.stringify({
            active: active ? { deploymentId: active.id, createdOn: active.created_on, source: active.source, versions: active.versions } : null,
            activeVersion,
            genericSettingsBindings: collectBindings(settings),
            versionsResultShape: { isArray: Array.isArray(versionsRaw), keys: versionsRaw && typeof versionsRaw === 'object' && !Array.isArray(versionsRaw) ? Object.keys(versionsRaw).sort() : [], rowCount: rows.length },
            versions: summaries,
          }, null, 2));
          NODE
