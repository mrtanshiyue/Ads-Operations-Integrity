name: Append Frontend Platform Handoff

on:
  push:
    branches: [docs/tidb-cloudflare-handoff-2026-08-06]
    paths:
      - scripts/append-platform-handoff.py
      - .github/workflows/append-platform-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/tidb-cloudflare-handoff-2026-08-06
          fetch-depth: 0
      - name: Append platform handoff
        run: |
          set -euo pipefail
          python3 scripts/append-platform-handoff.py
          grep -Fq '## 外部平台运行交接：TiDB Cloud 与 Cloudflare' README.md
          grep -Fq 'FETCH_CONCURRENCY = 1' README.md
          grep -Fq 'Compatibility date: 2026-07-24' README.md
      - name: Commit README update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "Document TiDB Cloud and Cloudflare frontend handoff"
          git push origin HEAD:docs/tidb-cloudflare-handoff-2026-08-06
