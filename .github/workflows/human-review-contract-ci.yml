name: Human Review Contract CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cloudflare/runtime/csv-recommendation-human-review-contract.js'
      - 'cloudflare/runtime/csv-recommendation-human-review-api.js'
      - 'cloudflare/runtime/csv-productization-api.js'
      - 'cloudflare/runtime/csv-productization-api-core.js'
      - 'assets/cloudflare-native-csv-recommendation-human-review-v1.js'
      - 'assets/cloudflare-native-csv-recommendation-inbox-v1.js'
      - 'assets/cloudflare-native-csv-recommendation-inbox-usability-v1.js'
      - 'assets/generated/inline-script-01.js'
      - 'scripts/enforce-cloudflare-native-asset-allowlist.mjs'
      - 'scripts/test-recommendation-human-review-contract.mjs'
      - 'scripts/test-recommendation-human-review-persistence.mjs'
      - 'scripts/test-recommendation-human-review-ui.mjs'
      - 'scripts/test-csv-recommendation-inbox-ui.mjs'
      - 'scripts/test-csv-recommendation-inbox-ui-core.mjs'
      - '.github/workflows/human-review-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: human-review-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Human Review Contract Focused CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate contract, persistence, and UI syntax
        run: |
          node --check cloudflare/runtime/csv-recommendation-human-review-contract.js
          node --check cloudflare/runtime/csv-recommendation-human-review-api.js
          node --check cloudflare/runtime/csv-productization-api.js
          node --check assets/cloudflare-native-csv-recommendation-human-review-v1.js
          node --check assets/generated/inline-script-01.js
          node --check scripts/test-recommendation-human-review-contract.mjs
          node --check scripts/test-recommendation-human-review-persistence.mjs
          node --check scripts/test-recommendation-human-review-ui.mjs

      - name: Validate human review invariants
        run: |
          node scripts/test-recommendation-human-review-contract.mjs
          node scripts/test-recommendation-human-review-persistence.mjs
          node scripts/test-recommendation-human-review-ui.mjs
