name: Human Review Contract CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cloudflare/foundation/migrations/store/0025_store_advisory_review_final_disposition.sql'
      - 'cloudflare/runtime/csv-recommendation-human-review-contract.js'
      - 'cloudflare/runtime/csv-recommendation-human-review-api.js'
      - 'cloudflare/runtime/csv-productization-api.js'
      - 'cloudflare/runtime/csv-productization-api-core.js'
      - 'assets/cloudflare-native-csv-recommendation-human-review-v1.js'
      - 'assets/cloudflare-native-csv-recommendation-inbox-v1.js'
      - 'assets/cloudflare-native-csv-recommendation-inbox-usability-v1.js'
      - 'assets/generated/inline-script-01.js'
      - 'scripts/enforce-cloudflare-native-asset-allowlist.mjs'
      - 'scripts/test-human-review-final-disposition.mjs'
      - 'scripts/test-recommendation-human-review-contract.mjs'
      - 'scripts/test-recommendation-human-review-persistence.mjs'
      - 'scripts/test-recommendation-human-review-ui.mjs'
      - 'scripts/test-csv-recommendation-inbox-ui.mjs'
      - 'scripts/test-csv-recommendation-inbox-ui-core.mjs'
      - '.github/workflows/human-review-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: human-review-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Human Review Contract Focused CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate contract, persistence, and UI syntax
        run: |
          node --check cloudflare/runtime/csv-recommendation-human-review-contract.js
          node --check cloudflare/runtime/csv-recommendation-human-review-api.js
          node --check cloudflare/runtime/csv-productization-api.js
          node --check assets/cloudflare-native-csv-recommendation-human-review-v1.js
          node --check assets/generated/inline-script-01.js
          node --check scripts/test-human-review-final-disposition.mjs
          node --check scripts/test-recommendation-human-review-contract.mjs
          node --check scripts/test-recommendation-human-review-persistence.mjs
          node --check scripts/test-recommendation-human-review-ui.mjs

      - name: Validate human review invariants
        run: |
          node scripts/test-human-review-final-disposition.mjs
          node scripts/test-recommendation-human-review-contract.mjs
          node scripts/test-recommendation-human-review-persistence.mjs
          node scripts/test-recommendation-human-review-ui.mjs

  implement-273:
    name: Apply #273 product patch and restore CI
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/273-human-review-rationale-capture' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/273-human-review-rationale-capture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and run deterministic patch from one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/265-dev-runtime-readonly-acceptance.yml').read_text()
          start = src.index("          node --input-type=module <<'NODE'\n") + len("          node --input-type=module <<'NODE'\n")
          end = src.index("\n          NODE\n", start)
          lines = src[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          # Replace two brittle whole-SQL-block edits with smaller semantic anchors.
          s = code.index("api = replaceOnce(api,\n`  if (existing) {")
          marker = "  'api_existing_note');"
          e = code.index(marker, s) + len(marker)
          replacement = r'''api = replaceOnce(api,
`  if (existing) {
    const sameState = existing.state === record.state;
    const sameNote = clean(existing.reviewer_note) === clean(note.value);`,
`  if (existing) {
    const effectiveNote = effectiveReviewNote(noteRequest, existing.reviewer_note);
    const sameState = existing.state === record.state;
    const sameNote = clean(existing.reviewer_note) === clean(effectiveNote);`,
  'api_existing_note_compare');
api = api.replace('.bind(reviewId, record.state, actor.user_id, note.value, now).run();', '.bind(reviewId, record.state, actor.user_id, effectiveNote, now).run();');
if (!api.includes('.bind(reviewId, record.state, actor.user_id, effectiveNote, now).run();')) throw new Error('api_existing_note_bind_missing');'''
          code = code[:s] + replacement + code[e:]

          s = code.index("api = replaceOnce(api,\n`      reviewId = raced.review_id;")
          marker = "  'api_race_note');"
          e = code.index(marker, s) + len(marker)
          replacement = r'''api = replaceOnce(api,
`      reviewId = raced.review_id;
      reused = raced.state === record.state && clean(raced.reviewer_note) === clean(note.value);`,
`      reviewId = raced.review_id;
      const racedEffectiveNote = effectiveReviewNote(noteRequest, raced.reviewer_note);
      reused = raced.state === record.state && clean(raced.reviewer_note) === clean(racedEffectiveNote);`,
  'api_race_note_compare');
api = api.replace('.bind(reviewId, record.state, actor.user_id, note.value, now).run();', '.bind(reviewId, record.state, actor.user_id, racedEffectiveNote, now).run();');
if (!api.includes('.bind(reviewId, record.state, actor.user_id, racedEffectiveNote, now).run();')) throw new Error('api_race_note_bind_missing');'''
          code = code[:s] + replacement + code[e:]
          Path('/tmp/273-apply-patch.mjs').write_text(code)
          PY
          node /tmp/273-apply-patch.mjs
      - name: Validate patched #273 contracts before push
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/runtime/csv-recommendation-human-review-api.js
          node --check assets/cloudflare-native-csv-recommendation-human-review-v1.js
          node --check scripts/test-recommendation-human-review-persistence.mjs
          node --check scripts/test-recommendation-human-review-ui.mjs
          node scripts/test-recommendation-human-review-persistence.mjs
          node scripts/test-recommendation-human-review-ui.mjs
          node scripts/test-recommendation-decision-packet.mjs
      - name: Commit only product changes and restore registered CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/human-review-contract-ci.yml
          git rm .github/workflows/265-dev-runtime-readonly-acceptance.yml
          git add cloudflare/runtime/csv-recommendation-human-review-api.js assets/cloudflare-native-csv-recommendation-human-review-v1.js scripts/test-recommendation-human-review-persistence.mjs scripts/test-recommendation-human-review-ui.mjs .github/workflows/human-review-contract-ci.yml
          git commit -m 'Implement #273 non-destructive Human Review rationale capture'
          git push origin HEAD:feat/273-human-review-rationale-capture
