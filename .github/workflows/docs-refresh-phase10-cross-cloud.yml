name: Docs One-shot Phase 10 Cross-Cloud Refresh

on:
  push:
    branches:
      - docs/phase10-cross-cloud-baseline-20260807
    paths:
      - scripts/docs_refresh_phase10_cross_cloud.py
      - .github/workflows/docs-refresh-phase10-cross-cloud.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase10-cross-cloud-baseline-20260807
          fetch-depth: 0
      - name: Refresh README baseline
        run: python scripts/docs_refresh_phase10_cross_cloud.py
      - name: Validate docs-only diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | grep -Fxq README.md
          test "$(git diff --name-only | wc -l)" -eq 1
          grep -Fq 'df81e84f4c9a1683fe021ab8477fabe3b23c5605' README.md
          grep -Fq '31170611396' README.md
          grep -Fq '31170611374' README.md
          grep -Fq '7364babfd3f108f668da95b74eab4d514e29e3a8' README.md
          grep -Fq '31177671671' README.md
          grep -Fq 'Bid Governance Parity Audit：`1.0.3`' README.md
      - name: Commit README
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Docs: refresh Phase 10 cross-cloud production baseline'
          git push origin HEAD:docs/phase10-cross-cloud-baseline-20260807
