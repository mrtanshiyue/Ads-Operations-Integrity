name: Temporary Dev Access readiness patch

on:
  push:
    branches:
      - prepare-dev-access-readiness-32929560329

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepare-dev-access-readiness-32929560329
          fetch-depth: 0
      - name: Add bounded Access propagation delay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/run-live-current-main-runtime-acceptance.mjs')
          s = p.read_text()
          old = "  await provisionDevelopmentAccess();\n  await diagnoseDevelopmentSurface();"
          new = "  await provisionDevelopmentAccess();\n  await new Promise((resolve) => setTimeout(resolve, 15_000));\n  await diagnoseDevelopmentSurface();"
          if s.count(old) != 1:
              raise SystemExit(f'expected one Dev Access provision/diagnose sequence, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/run-live-current-main-runtime-acceptance.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-live-current-main-runtime-acceptance.mjs
          git commit -m "test(acceptance): wait for Dev Access policy propagation"
          git push origin HEAD:prepare-dev-access-readiness-32929560329
