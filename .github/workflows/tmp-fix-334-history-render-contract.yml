name: Temporary #334 History Render Contract Fix

on:
  push:
    branches:
      - fix/csv-history-ledger-reentrant-global

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/csv-history-ledger-reentrant-global
          fetch-depth: 0
      - name: Move Historical Ledger render ownership assertion to implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-csv-data-quality-command-center-render-ownership.mjs')
          s = p.read_text()
          old = "path.join(repoRoot, 'assets/cloudflare-native-csv-history-ledger-v1.js'),"
          new = "path.join(repoRoot, 'assets/cloudflare-native-csv-history-ledger-impl-v1.js'),"
          if old in s:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one public History Ledger owner, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('History Ledger implementation ownership target not found')
          PY
          git diff --check
          git status --short
      - name: Commit and push if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Contract already points to implementation; no push required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/test-csv-data-quality-command-center-render-ownership.mjs
          git commit -m "test(csv): move history render ownership to implementation"
          git push origin HEAD:fix/csv-history-ledger-reentrant-global
