name: Cleanup Completed V4 Front-end Artifacts

on:
  push:
    branches: [phase-5-7-frontend-optimization-2026-08-05]
    paths: [".github/cleanup/execute"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: phase-5-7-frontend-optimization-2026-08-05
          fetch-depth: 1

      - name: Remove completed migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch .diagnostics .github/canary .github/deploy
          git rm -f --ignore-unmatch \
            .github/workflows/patch-v4-canary-origin.yml \
            .github/workflows/validate-cloud-v4-canary.yml \
            .github/workflows/validate-frontend-v4.yml \
            scripts/compare-warehouse-v3-v4.mjs \
            scripts/patch-v4-canary-origin.mjs \
            docs/CLOUD_V4_CANARY.md \
            docs/CLOUD_V4_PRODUCTION_CUTOVER.md \
            docs/CLOUD_V4_CUTOVER_CHECKLIST.md \
            docs/FRONTEND_V4_HANDOFF.md \
            docs/CLOUD_V4_RELEASE_CANDIDATE.md
          git rm -f --ignore-unmatch .github/cleanup/execute .github/workflows/cleanup-v4-migration-artifacts.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mrtanshiyue"
          git config user.email "54257052+mrtanshiyue@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No completed migration artifacts remained."
            exit 0
          fi
          git commit -m "Remove completed V4 Canary and cutover artifacts"
          git push origin HEAD:phase-5-7-frontend-optimization-2026-08-05
