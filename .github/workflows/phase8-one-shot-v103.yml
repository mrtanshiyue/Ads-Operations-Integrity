name: Phase 8 One-shot v1.0.3

on:
  push:
    branches:
      - phase8/parity-canonical-identity-v103
    paths:
      - .github/workflows/phase8-one-shot-v103.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8/parity-canonical-identity-v103
          fetch-depth: 0
      - name: Apply v1.0.3 patch
        run: |
          python scripts/phase8_patch_v103.py
          python scripts/phase8_patch_v103_testfix.py
      - name: Validate v1.0.3 contracts
        run: |
          node --check assets/bid-governance-parity-audit-v1.js
          node --check assets/private-cloud-query-v1.js
          node --check scripts/test-progressive-loader.mjs
          node --check scripts/test-bid-governance-parity-audit.mjs
          node scripts/test-progressive-loader.mjs
          node scripts/test-bid-governance-parity-audit.mjs
          git diff --check
      - name: Commit v1.0.3 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/bid-governance-parity-audit-v1.js assets/private-cloud-query-v1.js scripts/test-progressive-loader.mjs scripts/test-bid-governance-parity-audit.mjs
          git diff --cached --quiet && exit 1 || true
          git commit -m "Phase 8: canonicalize parity identity and bid comparability"
          git push origin HEAD:phase8/parity-canonical-identity-v103
