name: Phase 8 One-shot Canonical Identity v1.0.3

on:
  push:
    branches: [phase8/parity-canonical-identity-v103]
    paths: [.github/workflows/phase8-one-shot-v103.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8/parity-canonical-identity-v103
          fetch-depth: 0
      - name: Implement canonical identity and bid comparability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/bid-governance-parity-audit-v1.js')
          s = p.read_text()
          s = s.replace("const AUDIT_VERSION = '1.0.2';", "const AUDIT_VERSION = '1.0.3';")

          group_pattern = re.compile(r"  function groupKey\(row, index = 0\) \{.*?\n  \}\n\n  function summarizeRows", re.S)
          group_replacement = '''  function groupKey(row, index = 0) {
    const composite = [
      lower(row?.campaign), lower(row?.adGroup),
      lower(row?.targeting || row?.searchTerm), lower(row?.matchType),
    ].join('|');
    if (composite.replace(/\\|/g, '')) return `route:${composite}`;
    const targetingId = text(row?.targetingId);
    return targetingId ? `id:${targetingId}` : `row:${index}`;
  }

  function summarizeRows'''
          s, count = group_pattern.subn(group_replacement, s, count=1)
          assert count == 1, f'groupKey replacement count={count}'

          compare_pattern = re.compile(r"  function compareRows\(legacyInput, queryInput\) \{.*?\n  \}\n\n  async function run", re.S)
          compare_replacement = '''  function compareRows(legacyInput, queryInput) {
    const legacy = summarizeRows(legacyInput, { trustedBidOnly: false });
    const query = summarizeRows(queryInput, { trustedBidOnly: true });
    const metrics = Object.fromEntries(Object.entries(METRIC_RULES).map(([key, rule]) => [key, metricDelta(legacy.totals[key], query.totals[key], rule)]));
    const rowCount = metricDelta(legacy.totals.rowCount, query.totals.rowCount, { abs: 0, rel: 0 });
    const legacyKeys = new Set(legacy.groups.keys()); const queryKeys = new Set(query.groups.keys());
    const intersection = [...legacyKeys].filter(key => queryKeys.has(key));
    const union = new Set([...legacyKeys, ...queryKeys]);
    const groupOverlap = union.size ? intersection.length / union.size : 1;
    const legacyOnly = [...legacyKeys].filter(key => !queryKeys.has(key));
    const queryOnly = [...queryKeys].filter(key => !legacyKeys.has(key));
    const bidComparable = legacy.totals.bidKnownRows > 0 && query.totals.bidKnownRows > 0;
    const mismatches = []; let bidCompared = 0; let bidMismatch = 0; let bidMissingEither = 0;

    intersection.forEach(key => {
      const left = legacy.groups.get(key); const right = query.groups.get(key);
      const spend = metricDelta(left.spend, right.spend, METRIC_RULES.spend);
      const sales = metricDelta(left.sales, right.sales, METRIC_RULES.sales);
      const orders = metricDelta(left.orders, right.orders, METRIC_RULES.orders);
      const clicks = metricDelta(left.clicks, right.clicks, METRIC_RULES.clicks);
      const impressions = metricDelta(left.impressions, right.impressions, METRIC_RULES.impressions);
      let bidState = bidComparable ? 'none' : 'not-comparable'; let bidDelta = null;
      if (bidComparable) {
        if (left.latestBid === null || right.latestBid === null) {
          if (left.latestBid !== right.latestBid) { bidState = 'missing'; bidMissingEither += 1; }
        } else {
          bidCompared += 1; bidDelta = right.latestBid - left.latestBid;
          if (Math.abs(bidDelta) > 0.000001) { bidState = 'mismatch'; bidMismatch += 1; } else bidState = 'match';
        }
      }
      if ([spend, sales, orders, clicks, impressions].some(item => !item.pass) || (bidComparable && ['mismatch', 'missing'].includes(bidState))) {
        mismatches.push({
          key, targetingId: left.targetingId || right.targetingId, campaign: left.campaign || right.campaign,
          adGroup: left.adGroup || right.adGroup, targeting: left.targeting || right.targeting, matchType: left.matchType || right.matchType,
          legacySpend: left.spend, querySpend: right.spend, spendDelta: spend.absolute,
          legacySales: left.sales, querySales: right.sales, salesDelta: sales.absolute,
          legacyOrders: left.orders, queryOrders: right.orders, ordersDelta: orders.absolute,
          legacyBid: left.latestBid, queryBid: right.latestBid, bidDelta, bidState,
        });
      }
    });
    legacyOnly.forEach(key => {
      const row = legacy.groups.get(key);
      mismatches.push({ key, side: 'legacy-only', targetingId: row.targetingId, campaign: row.campaign, adGroup: row.adGroup, targeting: row.targeting,
        matchType: row.matchType, legacySpend: row.spend, querySpend: 0, spendDelta: -row.spend, legacySales: row.sales, querySales: 0,
        salesDelta: -row.sales, legacyOrders: row.orders, queryOrders: 0, ordersDelta: -row.orders, legacyBid: row.latestBid, queryBid: null, bidDelta: null, bidState: bidComparable ? 'missing' : 'not-comparable' });
    });
    queryOnly.forEach(key => {
      const row = query.groups.get(key);
      mismatches.push({ key, side: 'query-only', targetingId: row.targetingId, campaign: row.campaign, adGroup: row.adGroup, targeting: row.targeting,
        matchType: row.matchType, legacySpend: 0, querySpend: row.spend, spendDelta: row.spend, legacySales: 0, querySales: row.sales,
        salesDelta: row.sales, legacyOrders: 0, queryOrders: row.orders, ordersDelta: row.orders, legacyBid: null, queryBid: row.latestBid, bidDelta: null, bidState: bidComparable ? 'missing' : 'not-comparable' });
    });
    mismatches.sort((a, b) => Math.abs(b.spendDelta || 0) - Math.abs(a.spendDelta || 0) || Math.abs(b.salesDelta || 0) - Math.abs(a.salesDelta || 0));

    const totalsPass = rowCount.pass && Object.values(metrics).every(item => item.pass);
    const identityPass = groupOverlap >= 0.995 && legacyOnly.length === 0 && queryOnly.length === 0;
    const bidPass = bidComparable && bidMismatch === 0 && bidMissingEither === 0;
    const metricParityPass = totalsPass && identityPass;
    const fullParityPass = metricParityPass && bidPass;
    const near = !metricParityPass && Object.values(metrics).every(item => item.relative <= 0.01 || Math.abs(item.absolute) <= 1) && groupOverlap >= 0.98;
    const verdict = fullParityPass ? 'pass' : (metricParityPass && !bidComparable) || near ? 'warn' : 'fail';
    return {
      verdict, metricParityPass, fullParityPass, migrationCandidate: false, executionAuthorized: false,
      totalsPass, identityPass, bidComparable, bidPass, bidParityPass: bidPass, rowCount, metrics, groupOverlap, matchedGroups: intersection.length,
      legacyOnlyCount: legacyOnly.length, queryOnlyCount: queryOnly.length, bidCompared, bidMismatch, bidMissingEither,
      legacy: legacy.totals, query: query.totals, mismatches: mismatches.slice(0, MAX_MISMATCH_ROWS),
    };
  }

  async function run'''
          s, count = compare_pattern.subn(compare_replacement, s, count=1)
          assert count == 1, f'compareRows replacement count={count}'

          old = '''      const readiness = payload.governance?.readiness || {};
      const adProductScopeProven = readiness.adProductReady === true;
      const allQueryRows = Array.isArray(payload.rows) ? payload.rows : [];
      const queryRows = adProductScopeProven
        ? allQueryRows.filter(row => text(row?.adProduct).toUpperCase() === 'SP')
        : allQueryRows;
      const comparison = compareRows(legacy, queryRows);
      comparison.adProductScopeProven = adProductScopeProven;
      comparison.queryScopeMode = adProductScopeProven ? 'source-proven-sp' : 'unproven-ad-product-diagnostic';
      comparison.scopeBlockers = adProductScopeProven ? [] : ['adProductReady'];
      comparison.migrationCandidate = Boolean(comparison.metricParityPass && adProductScopeProven);'''
          new = '''      const readiness = payload.governance?.readiness || {};
      const adProductScopeProven = readiness.adProductReady === true;
      const allQueryRows = Array.isArray(payload.rows) ? payload.rows : [];
      const queryRows = adProductScopeProven
        ? allQueryRows.filter(row => text(row?.adProduct).toUpperCase() === 'SP')
        : allQueryRows;
      const comparison = compareRows(legacy, queryRows);
      const requiredReadiness = [
        'targetingIdentityReady', 'bidSourceColumnReady', 'bidValueNullabilityTrusted',
        'adProductReady', 'advertisedProductIdentityReady', 'attributionMaturityReady',
      ];
      const migrationBlockers = requiredReadiness.filter(key => readiness[key] !== true);
      if (!comparison.bidComparable) migrationBlockers.push('legacyBidComparable');
      comparison.adProductScopeProven = adProductScopeProven;
      comparison.queryScopeMode = adProductScopeProven ? 'source-proven-sp' : 'unproven-ad-product-diagnostic';
      comparison.bidGovernanceReady = readiness.bidGovernanceReady === true;
      comparison.scopeBlockers = [...migrationBlockers];
      comparison.migrationBlockers = [...migrationBlockers];
      comparison.migrationCandidate = Boolean(
        comparison.metricParityPass && comparison.bidParityPass
        && comparison.bidComparable && comparison.bidGovernanceReady && migrationBlockers.length === 0
      );'''
          assert s.count(old) == 1, f'run governance block count={s.count(old)}'
          s = s.replace(old, new)

          s = s.replace("if (verdict === 'warn') return 'Near Parity · 继续审计';", "if (verdict === 'warn') return 'Metric / Identity Parity · Bid / 治理待审计';")
          old_banner = "banner.textContent = `${verdictLabel(c.verdict)} · ${c.adProductScopeProven ? 'SP scope source-proven' : 'Ad Product scope unproven · diagnostic only'} · migrationCandidate=${Boolean(c.migrationCandidate)} · executionAuthorized=false · Query governance=${text(state.governance?.schemaVersion) || 'missing'}`;"
          new_banner = "banner.textContent = `${verdictLabel(c.verdict)} · ${c.adProductScopeProven ? 'SP scope source-proven' : 'Ad Product scope unproven · diagnostic only'} · Bid=${c.bidComparable ? (c.bidParityPass ? 'comparable/pass' : 'comparable/gap') : 'not comparable'} · blockers=${(c.migrationBlockers || []).join(', ') || 'none'} · migrationCandidate=${Boolean(c.migrationCandidate)} · executionAuthorized=false`;"
          assert s.count(old_banner) == 1, f'banner count={s.count(old_banner)}'
          s = s.replace(old_banner, new_banner)
          old_kpi = "['Bid mismatch', `${fmtInt(c.bidMismatch)} + ${fmtInt(c.bidMissingEither)} missing`]"
          new_kpi = "['Bid parity', c.bidComparable ? `${fmtInt(c.bidMismatch)} mismatch · ${fmtInt(c.bidMissingEither)} missing` : 'Not comparable']"
          assert s.count(old_kpi) == 1, f'kpi count={s.count(old_kpi)}'
          s = s.replace(old_kpi, new_kpi)
          p.write_text(s)

          p = Path('assets/private-cloud-query-v1.js')
          s = p.read_text()
          old = "const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1.0.2';"
          new = "const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1.0.3';"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('scripts/test-progressive-loader.mjs')
          s = p.read_text()
          replacements = [
            ("assert.match(parityAudit, /const AUDIT_VERSION = '1\\.0\\.2'/);", "assert.match(parityAudit, /const AUDIT_VERSION = '1\\.0\\.3'/);"),
            ("assert.match(parityAudit, /scopeBlockers = adProductScopeProven \\? \\[\\] : \\['adProductReady'\\]/);", "assert.match(parityAudit, /const migrationBlockers = requiredReadiness\\.filter/);\nassert.match(parityAudit, /legacyBidComparable/);"),
            ("assert.match(parityAudit, /migrationCandidate = Boolean\\(comparison\\.metricParityPass && adProductScopeProven\\)/);", "assert.match(parityAudit, /comparison\\.bidParityPass/);\nassert.match(parityAudit, /comparison\\.bidGovernanceReady/);"),
          ]
          for old,new in replacements:
            assert s.count(old) == 1, f'progressive replacement count={s.count(old)}: {old}'
            s = s.replace(old,new)
          p.write_text(s)

          p = Path('scripts/test-bid-governance-parity-audit.mjs')
          s = p.read_text()
          replacements = [
            ("assert.match(source, /const AUDIT_VERSION = '1\\.0\\.2'/);", "assert.match(source, /const AUDIT_VERSION = '1\\.0\\.3'/);"),
            ("assert.match(source, /migrationCandidate = Boolean\\(comparison\\.metricParityPass && adProductScopeProven\\)/);", "assert.match(source, /comparison\\.bidParityPass/);\nassert.match(source, /comparison\\.bidGovernanceReady/);\nassert.match(source, /legacyBidComparable/);"),
            ("governance: { schemaVersion: 'ads-query-governance-v2', readiness: { bidValueNullabilityTrusted: true, adProductReady } },", "governance: { schemaVersion: 'ads-query-governance-v2', readiness: { targetingIdentityReady: true, bidSourceColumnReady: true, bidValueNullabilityTrusted: true, adProductReady, advertisedProductIdentityReady: true, attributionMaturityReady: true, bidGovernanceReady: adProductReady } },"),
            ("assert.equal(audit.version, '1.0.2');", "assert.equal(audit.version, '1.0.3');"),
          ]
          for old,new in replacements:
            assert s.count(old) == 1, f'dedicated replacement count={s.count(old)}: {old}'
            s = s.replace(old,new)

          marker = "assert.equal(exact.metrics.sales.absolute, 0);\n\nconst changedQuery"
          insert = '''assert.equal(exact.metrics.sales.absolute, 0);
assert.equal(exact.bidComparable, true);
assert.equal(exact.bidParityPass, true);

const legacyWithoutIdentityOrBid = legacyRows.map(row => ({ ...row, targetingId: '', currentBid: null }));
const queryWithProvenIdentityAndBid = queryRows.map((row, index) => ({ ...row, targetingId: index < 2 ? 'T1' : 'T2', currentBid: index === 0 ? 0.5 : index === 1 ? 0.55 : 0.4 }));
const productionShape = audit.compareRows(legacyWithoutIdentityOrBid, queryWithProvenIdentityAndBid);
assert.equal(productionShape.metricParityPass, true);
assert.equal(productionShape.identityPass, true);
assert.equal(productionShape.groupOverlap, 1);
assert.equal(productionShape.legacyOnlyCount, 0);
assert.equal(productionShape.queryOnlyCount, 0);
assert.equal(productionShape.bidComparable, false);
assert.equal(productionShape.bidParityPass, false);
assert.equal(productionShape.verdict, 'warn');
assert.equal(productionShape.mismatches.length, 0);

const changedQuery'''
          assert s.count(marker) == 1, f'production shape marker count={s.count(marker)}'
          s = s.replace(marker, insert)

          old = "assert.deepEqual([...runResult.comparison.scopeBlockers], ['adProductReady']);"
          new = "assert.deepEqual([...runResult.comparison.scopeBlockers], ['adProductReady']);\nassert.equal(runResult.comparison.bidGovernanceReady, false);"
          assert s.count(old) == 1
          s = s.replace(old,new)
          old = "assert.deepEqual([...provenRun.comparison.scopeBlockers], []);\nassert.equal(provenRun.comparison.migrationCandidate, true);"
          new = "assert.deepEqual([...provenRun.comparison.scopeBlockers], []);\nassert.equal(provenRun.comparison.bidGovernanceReady, true);\nassert.equal(provenRun.comparison.bidComparable, true);\nassert.equal(provenRun.comparison.migrationCandidate, true);"
          assert s.count(old) == 1
          s = s.replace(old,new)
          p.write_text(s)
          PY
          node --check assets/bid-governance-parity-audit-v1.js
          node --check assets/private-cloud-query-v1.js
          node --check scripts/test-progressive-loader.mjs
          node --check scripts/test-bid-governance-parity-audit.mjs
          node scripts/test-progressive-loader.mjs
          node scripts/test-bid-governance-parity-audit.mjs
          git diff --check
      - name: Commit v1.0.3 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/bid-governance-parity-audit-v1.js assets/private-cloud-query-v1.js scripts/test-progressive-loader.mjs scripts/test-bid-governance-parity-audit.mjs
          git diff --cached --quiet && { echo 'No changes staged'; exit 1; }
          git commit -m "Phase 8: canonicalize parity identity and bid comparability"
          git push origin HEAD:phase8/parity-canonical-identity-v103
