name: Human Review Final Disposition Runtime Readiness

on:
  push:
    branches:
      - acceptance/259-human-review-final-disposition-runtime
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-final-disposition-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    if: github.event_name != 'pull_request' || github.head_ref == 'acceptance/259-human-review-final-disposition-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repository-pinned Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require exact canonical main and safety config
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "68b8ad353289ccb5d7e60284844b99193be44225"
          grep -F '"SYNC_TRIGGER_ENABLED": "false"' cloudflare/runtime/wrangler.native.jsonc >/dev/null
          grep -F '"PHASE5_SINGLE_RUN_PERMIT_ID": ""' cloudflare/runtime/wrangler.native.jsonc >/dev/null
          grep -F '"PHASE5_SINGLE_RUN_REPORT_DATE": ""' cloudflare/runtime/wrangler.native.jsonc >/dev/null
          grep -F '"ACCESS_MODE": "enforce"' cloudflare/runtime/wrangler.native.jsonc >/dev/null
      - name: Verify Dev Store migration ledger — read only
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 migrations list ads-ops-store-dev --remote --env dev --config cloudflare/runtime/wrangler.native.jsonc | tee /tmp/dev-migrations.txt
          grep -F '0025_store_advisory_review_final_disposition.sql' /tmp/dev-migrations.txt
      - name: Verify Production Store migration ledgers — read only
        run: |
          set -euo pipefail
          for db in ads-ops-store-prod-01 ads-ops-store-prod-02 ads-ops-store-prod-03 ads-ops-store-prod-04; do
            echo "=== ${db} ==="
            npx --no-install wrangler d1 migrations list "${db}" --remote --env production --config cloudflare/runtime/wrangler.native.jsonc | tee "/tmp/${db}-migrations.txt"
            grep -F '0025_store_advisory_review_final_disposition.sql' "/tmp/${db}-migrations.txt"
          done
      - name: Verify current Web and Sync runtime metadata — read only
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('cloudflare_credentials_required');
          const headers = { authorization: `Bearer ${token}`, accept: 'application/json' };
          async function cf(path) {
            const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`, { headers });
            const b = await r.json();
            if (!r.ok || !b.success) throw new Error(`cloudflare_read_failed:${path}:${r.status}`);
            return b.result;
          }
          async function worker(name) {
            const deployments = await cf(`/workers/scripts/${encodeURIComponent(name)}/deployments`);
            const active = deployments?.[0];
            if (!active?.id || !active?.versions?.[0]?.version_id) throw new Error(`active_deployment_missing:${name}`);
            const versionId = active.versions[0].version_id;
            const version = await cf(`/workers/scripts/${encodeURIComponent(name)}/versions/${encodeURIComponent(versionId)}`);
            const schedules = await cf(`/workers/scripts/${encodeURIComponent(name)}/schedules`);
            return { name, deploymentId: active.id, versionId, metadata: version?.metadata || {}, schedules };
          }
          const dev = await worker('ads-operations-web-dev');
          const prod = await worker('ads-operations-web-prod');
          const sync = await worker('ads-operations-sync-prod');
          if ((dev.schedules || []).length) throw new Error('dev_web_schedule_not_empty');
          if ((prod.schedules || []).length) throw new Error('prod_web_schedule_not_empty');
          if ((sync.schedules || []).length) throw new Error('prod_sync_schedule_not_empty');
          const prodVars = prod.metadata?.bindings || [];
          const syncVars = sync.metadata?.bindings || [];
          const binding = (arr, name) => arr.find((x) => x?.name === name)?.text;
          if (binding(prodVars, 'SYNC_TRIGGER_ENABLED') !== 'false') throw new Error('prod_sync_trigger_not_false');
          if ((binding(prodVars, 'PHASE5_SINGLE_RUN_PERMIT_ID') || '') !== '') throw new Error('prod_permit_not_blank');
          if ((binding(prodVars, 'PHASE5_SINGLE_RUN_REPORT_DATE') || '') !== '') throw new Error('prod_report_date_not_blank');
          if (binding(prodVars, 'ACCESS_MODE') !== 'enforce') throw new Error('prod_access_mode_not_enforce');
          if (binding(syncVars, 'AMAZON_ADS_ENABLED') !== 'false') throw new Error('amazon_ads_not_hard_off');
          console.log(JSON.stringify({ ok:true, targetMain:'68b8ad353289ccb5d7e60284844b99193be44225', dev, prod, sync }, null, 2));
          NODE
