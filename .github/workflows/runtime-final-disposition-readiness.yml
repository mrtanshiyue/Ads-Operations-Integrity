name: Human Review Final Disposition Runtime Readiness

on:
  push:
    branches:
      - acceptance/259-human-review-final-disposition-runtime
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-final-disposition-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    if: github.event_name != 'pull_request' || github.head_ref == 'acceptance/259-human-review-final-disposition-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repository-pinned Wrangler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.114.0
      - name: Require exact canonical main and safety config
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "fea3005caf7b233870b75787162a580b1d22a28e"
          grep -F '"SYNC_TRIGGER_ENABLED": "false"' cloudflare/runtime/wrangler.native.jsonc >/dev/null
          grep -F '"PHASE5_SINGLE_RUN_PERMIT_ID": ""' cloudflare/runtime/wrangler.native.jsonc >/dev/null
          grep -F '"PHASE5_SINGLE_RUN_REPORT_DATE": ""' cloudflare/runtime/wrangler.native.jsonc >/dev/null
          grep -F '"ACCESS_MODE": "enforce"' cloudflare/runtime/wrangler.native.jsonc >/dev/null
      - name: Verify Dev Store migration ledger — read only
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 migrations list ads-ops-store-dev --remote --env dev --config cloudflare/runtime/wrangler.native.jsonc | tee /tmp/dev-migrations.txt
          if grep -F '0025_store_advisory_review_final_disposition.sql' /tmp/dev-migrations.txt; then
            echo 'Dev 0025 unexpectedly pending' >&2
            exit 1
          fi
      - name: Verify Production Store migration ledgers — read only
        run: |
          set -euo pipefail
          for db in ads-ops-store-prod-01 ads-ops-store-prod-02 ads-ops-store-prod-03 ads-ops-store-prod-04; do
            echo "=== ${db} ==="
            npx --no-install wrangler d1 migrations list "${db}" --remote --env production --config cloudflare/runtime/wrangler.native.jsonc | tee "/tmp/${db}-migrations.txt"
            grep -F '0025_store_advisory_review_final_disposition.sql' "/tmp/${db}-migrations.txt"
          done
      - name: Verify current Web and Sync runtime metadata — read only
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('cloudflare_credentials_required');
          const headers = { authorization: `Bearer ${token}`, accept: 'application/json' };
          async function cf(path) {
            const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}${path}`, { headers });
            const b = await r.json().catch(() => ({}));
            if (!r.ok || b?.success === false) throw new Error(`cloudflare_read_failed:${path}:${b?.errors?.[0]?.code || r.status}`);
            return b;
          }
          function deploymentHead(payload) {
            const rows = Array.isArray(payload?.result?.deployments) ? payload.result.deployments : [];
            if (!rows.length) throw new Error('deployment_list_empty');
            return { deploymentId: rows[0].id, versionId: rows[0]?.versions?.[0]?.version_id || null, createdOn: rows[0].created_on || null };
          }
          function bindings(payload) { return Array.isArray(payload?.result?.bindings) ? payload.result.bindings : []; }
          function textBinding(rows, name) { return rows.find((row) => row?.name === name)?.text ?? null; }
          function scheduleCount(payload) {
            const rows = Array.isArray(payload?.result) ? payload.result : Array.isArray(payload?.result?.schedules) ? payload.result.schedules : [];
            return rows.length;
          }
          async function worker(name) {
            const deployments = await cf(`/workers/scripts/${encodeURIComponent(name)}/deployments`);
            const head = deploymentHead(deployments);
            if (!head.versionId) throw new Error(`active_version_missing:${name}`);
            const settings = await cf(`/workers/scripts/${encodeURIComponent(name)}/settings`);
            const schedules = await cf(`/workers/scripts/${encodeURIComponent(name)}/schedules`);
            return { name, ...head, bindings: bindings(settings), scheduleCount: scheduleCount(schedules) };
          }
          const dev = await worker('ads-operations-web-dev');
          const prod = await worker('ads-operations-web-prod');
          const sync = await worker('ads-operations-sync-prod');
          if (dev.scheduleCount !== 0) throw new Error('dev_web_schedule_not_empty');
          if (prod.scheduleCount !== 0) throw new Error('prod_web_schedule_not_empty');
          if (sync.scheduleCount !== 0) throw new Error('prod_sync_schedule_not_empty');
          if (textBinding(prod.bindings, 'SYNC_TRIGGER_ENABLED') !== 'false') throw new Error('prod_sync_trigger_not_false');
          if ((textBinding(prod.bindings, 'PHASE5_SINGLE_RUN_PERMIT_ID') || '') !== '') throw new Error('prod_permit_not_blank');
          if ((textBinding(prod.bindings, 'PHASE5_SINGLE_RUN_REPORT_DATE') || '') !== '') throw new Error('prod_report_date_not_blank');
          if (textBinding(prod.bindings, 'ACCESS_MODE') !== 'enforce') throw new Error('prod_access_mode_not_enforce');
          if (textBinding(sync.bindings, 'AMAZON_ADS_ENABLED') !== 'false') throw new Error('amazon_ads_not_hard_off');
          const compact = (w) => ({ name:w.name, deploymentId:w.deploymentId, versionId:w.versionId, createdOn:w.createdOn, scheduleCount:w.scheduleCount });
          console.log(JSON.stringify({
            ok:true,
            targetMain:'fea3005caf7b233870b75787162a580b1d22a28e',
            dev: compact(dev),
            prod: compact(prod),
            sync: { ...compact(sync), amazonAdsEnabled:false },
            productionSafety:{ accessMode:'enforce', syncTriggerEnabled:false, permitBlank:true, reportDateBlank:true }
          }, null, 2));
          NODE
