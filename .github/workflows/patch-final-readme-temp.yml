name: Patch final Frontend README (temporary)

on:
  push:
    branches:
      - docs/final-production-baseline-20260806
    paths:
      - .github/workflows/patch-final-readme-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/final-production-baseline-20260806
          fetch-depth: 0

      - name: Refresh final verified production handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '31074460434': '31077568702',
              'b43bab4bc7a953b1555aca56268b17489af17307': '58d31c6867e40a6deaff70cd3eb8461a65e267a5',
              '| 最终 Chromium 总耗时 | 约 135 秒 |': '| 最终 Chromium 总耗时 | 约 209 秒 |',
              '- Cloudflare Worker 版本：`39`（100% 流量）': '- Cloudflare Worker 发布：以最新成功 Warehouse Run 与 Worker `/api/v1/health` 为准',
              '| Worker deployment | Cloudflare version `39` / 100% traffic |': '| Worker deployment | Warehouse Run `31077568702`; 实时版本以 Worker Health 为准 |',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected baseline: {old}')
              text = text.replace(old, new)

          app_marker = '- 最后一个应用代码基线：`5f9a4bd8190e57bcbf993884028cef9c70467c87`\n'
          app_addition = app_marker + '- Warehouse 生产代码/验收基线：`58d31c6867e40a6deaff70cd3eb8461a65e267a5`\n'
          if '- Warehouse 生产代码/验收基线：' not in text:
              if app_marker not in text:
                  raise SystemExit('missing application baseline marker')
              text = text.replace(app_marker, app_addition, 1)

          closure_marker = '最后一次完整生产关闭门禁同时验证：Worker、TiDB 迁移与对账、Raw、Query APIs、32 文件历史完整性审计、GitHub Pages、Loader、Query Client 和真实 Chromium 全量导入。'
          closure_addition = closure_marker + '\n\nGitHub Actions 的生产 Chromium 验收为规避 Runner 到 workers.dev 的 HTTP/3 不稳定，仅在 CI 启动参数中使用 `--disable-quic`；真实用户浏览器和生产页面不受影响。Warehouse 历史审计只对已识别的瞬时 socket/stream 响应体中断做有界重试，所有摘要、行数、脱敏和 TiDB 来源断言保持 fail-closed。'
          if 'HTTP/3 不稳定' not in text:
              if closure_marker not in text:
                  raise SystemExit('missing closure marker')
              text = text.replace(closure_marker, closure_addition, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README-only update and remove temporary workflow
        run: |
          rm .github/workflows/patch-final-readme-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/patch-final-readme-temp.yml
          printf '%s\n' '.github/workflows/patch-final-readme-temp.yml' 'README.md' > /tmp/expected
          git diff --cached --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m 'Record final verified frontend baseline'
          git push origin HEAD:docs/final-production-baseline-20260806
