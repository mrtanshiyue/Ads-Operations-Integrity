name: Apply Progressive Frontend Patch

on:
  push:
    branches: [optimize/frontend-progressive-query-first-v1]
    paths:
      - ".bootstrap-progressive/**"
      - ".github/workflows/apply-progressive-patch.yml"

permissions:
  contents: write

concurrency:
  group: apply-progressive-frontend-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize validated progressive patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap-progressive ]; then
            echo "Payload already removed"
            exit 0
          fi
          rm -rf /tmp/progressive-materialized
          mkdir -p /tmp/progressive-materialized
          cat .bootstrap-progressive/chunk-* > /tmp/progressive-payload.b64
          base64 --decode /tmp/progressive-payload.b64 > /tmp/progressive-payload.tgz
          tar -xzf /tmp/progressive-payload.tgz -C /tmp/progressive-materialized
          cp /tmp/progressive-materialized/assets/private-cloud-warehouse-v4.js assets/private-cloud-warehouse-v4.js
          cp /tmp/progressive-materialized/assets/private-cloud-query-v1.js assets/private-cloud-query-v1.js
          cp /tmp/progressive-materialized/scripts/test-progressive-loader.mjs scripts/test-progressive-loader.mjs
          node --check assets/private-cloud-warehouse-v4.js
          node --check assets/private-cloud-query-v1.js
          node --check scripts/test-progressive-loader.mjs
          node scripts/test-progressive-loader.mjs
          rm -rf .bootstrap-progressive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/private-cloud-warehouse-v4.js assets/private-cloud-query-v1.js scripts/test-progressive-loader.mjs .bootstrap-progressive
          git commit -m "Implement Query-first progressive frontend loading"
          git push origin HEAD:optimize/frontend-progressive-query-first-v1
