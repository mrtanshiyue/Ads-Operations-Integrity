name: Deploy Ads Operations Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci-main.yml"

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish complete static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/private-cloud-warehouse-v3.js
          test -s assets/private-cloud-warehouse-v4.js
          rm -rf _site .validate
          mkdir -p _site/assets .validate
          cp index.html _site/index.html
          cp -a assets/. _site/assets/
          : > _site/.nojekyll

      - name: Extract inline JavaScript without modifying source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.active = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script':
                      return
                  values = {k.lower(): (v or '') for k, v in attrs}
                  script_type = values.get('type', '').lower()
                  self.active = 'src' not in values and script_type in ('', 'text/javascript', 'application/javascript')
                  self.current = []

              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.scripts.append(''.join(self.current))
                      self.active = False
                      self.current = []

              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)

          source = Path('index.html')
          if source.stat().st_size < 1000:
              raise SystemExit('index.html is unexpectedly small')
          parser = ScriptExtractor()
          parser.feed(source.read_text(encoding='utf-8'))
          target = Path('.validate')
          for index, script in enumerate(parser.scripts, 1):
              (target / f'inline-{index:03d}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(parser.scripts)} inline script(s)')
          PY

      - name: Validate JavaScript and production loader invariants
        shell: bash
        run: |
          set -euo pipefail
          find .validate assets -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          grep -Fq "warehouse-v4-production" assets/private-cloud-warehouse-v4.js
          grep -Fq "private-cloud-warehouse-v4.js" assets/private-cloud-warehouse-v3.js
          grep -Fq "https://amazon-warehouse-cloud-v4.tanshiyuesir.workers.dev" assets/private-cloud-warehouse-v4.js
          ! grep -Fq "warehouse-v4-canary" assets/private-cloud-warehouse-v4.js
          ! grep -Eq "\^\(3\|4\)|startsWith\(['\"]3" assets/private-cloud-warehouse-v4.js
          test -s _site/assets/private-cloud-warehouse-v3.js
          test -s _site/assets/private-cloud-warehouse-v4.js

      - name: Publish exact validated artifact to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show-ref --verify --quiet refs/heads/gh-pages || git fetch origin gh-pages:gh-pages
          rm -rf /tmp/ads-operations-gh-pages
          git worktree add /tmp/ads-operations-gh-pages gh-pages
          find /tmp/ads-operations-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. /tmp/ads-operations-gh-pages/
          printf 'deployed_at=%s\nsource_sha=%s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > /tmp/ads-operations-gh-pages/_pages_config_status.txt
          cd /tmp/ads-operations-gh-pages
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy validated static site from ${GITHUB_SHA}"
            git push origin gh-pages
          else
            echo "gh-pages is already current"
          fi
