name: Deploy Ads Operations Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/test-progressive-loader.mjs"
      - "scripts/test-query-native-modules.mjs"
      - "scripts/test-query-native-ads-trend.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci-main.yml"

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish complete static site
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact production commit without Marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version

      - name: Build immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/private-cloud-warehouse-v3.js
          test -s assets/private-cloud-warehouse-v4.js
          test -s assets/private-cloud-query-v1.js
          test -s assets/query-native-module-data-v1.js
          test -s assets/query-native-ads-trend-v1.js
          test -s assets/query-native-ads-trend-host-v1.js
          test -s scripts/test-progressive-loader.mjs
          test -s scripts/test-query-native-modules.mjs
          test -s scripts/test-query-native-ads-trend.mjs
          rm -rf _site .validate
          mkdir -p _site/assets .validate
          cp index.html _site/index.html
          cp -a assets/. _site/assets/
          : > _site/.nojekyll

      - name: Extract inline JavaScript without modifying source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.active = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script':
                      return
                  values = {k.lower(): (v or '') for k, v in attrs}
                  script_type = values.get('type', '').lower()
                  self.active = 'src' not in values and script_type in ('', 'text/javascript', 'application/javascript')
                  self.current = []

              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.scripts.append(''.join(self.current))
                      self.active = False
                      self.current = []

              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)

          source = Path('index.html')
          if source.stat().st_size < 1000:
              raise SystemExit('index.html is unexpectedly small')
          parser = ScriptExtractor()
          parser.feed(source.read_text(encoding='utf-8'))
          target = Path('.validate')
          for index, script in enumerate(parser.scripts, 1):
              (target / f'inline-{index:03d}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(parser.scripts)} inline script(s)')
          PY

      - name: Validate JavaScript and production loader invariants
        shell: bash
        run: |
          set -euo pipefail
          find .validate assets -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --check scripts/test-progressive-loader.mjs
          node --check scripts/test-query-native-modules.mjs
          node --check scripts/test-query-native-ads-trend.mjs
          node scripts/test-progressive-loader.mjs
          node scripts/test-query-native-modules.mjs
          node scripts/test-query-native-ads-trend.mjs
          grep -Fq "warehouse-v4-production" assets/private-cloud-warehouse-v4.js
          grep -Fq "private-cloud-warehouse-v4.js" assets/private-cloud-warehouse-v3.js
          grep -Fq "https://amazon-warehouse-cloud-v4.tanshiyuesir.workers.dev" assets/private-cloud-warehouse-v4.js
          grep -Fq "const LOADER_VERSION = '4.3.0'" assets/private-cloud-warehouse-v4.js
          grep -Fq "const CLIENT_VERSION = '1.3.0'" assets/private-cloud-query-v1.js
          grep -Fq "const QUERY_NATIVE_ADAPTER_VERSION = '1.2.0'" assets/private-cloud-query-v1.js
          grep -Fq "const QUERY_NATIVE_TREND_VERSION = '1.1.0'" assets/private-cloud-query-v1.js
          grep -Fq "ensureQueryNativeModules" assets/private-cloud-query-v1.js
          grep -Fq "query-native-ads-trend-host-v1.js?v=" assets/private-cloud-query-v1.js
          grep -Fq "const ADAPTER_VERSION = '1.2.0'" assets/query-native-module-data-v1.js
          grep -Fq "ADS_GOVERNANCE_VERSION = 'ads-query-governance-v2'" assets/query-native-module-data-v1.js
          grep -Fq "nullable-bid-semantics" assets/query-native-module-data-v1.js
          grep -Fq "const CONTROLLER_VERSION = '1.1.0'" assets/query-native-ads-trend-v1.js
          grep -Fq "Reported Spend" assets/query-native-ads-trend-v1.js
          grep -Fq "源报表未提供可验证归因窗口" assets/query-native-ads-trend-v1.js
          grep -Fq "不能据此授权自动竞价" assets/query-native-ads-trend-v1.js
          ! grep -Fq "DEFAULT_ATTRIBUTION_DAYS" assets/query-native-ads-trend-v1.js
          grep -Fq "const HOST_VERSION = '1.0.0'" assets/query-native-ads-trend-host-v1.js
          grep -Fq "loadingStrategy: 'query-first-progressive-v1'" assets/private-cloud-warehouse-v4.js
          ! grep -Fq "warehouse-v4-canary" assets/private-cloud-warehouse-v4.js
          ! grep -Eq "\^\(3\|4\)|startsWith\(['\"]3" assets/private-cloud-warehouse-v4.js
          test -s _site/assets/private-cloud-warehouse-v3.js
          test -s _site/assets/private-cloud-warehouse-v4.js
          test -s _site/assets/private-cloud-query-v1.js
          test -s _site/assets/query-native-module-data-v1.js
          test -s _site/assets/query-native-ads-trend-v1.js
          test -s _site/assets/query-native-ads-trend-host-v1.js

      - name: Publish exact validated artifact to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show-ref --verify --quiet refs/heads/gh-pages || git fetch origin gh-pages:gh-pages
          rm -rf /tmp/ads-operations-gh-pages
          git worktree add /tmp/ads-operations-gh-pages gh-pages
          find /tmp/ads-operations-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. /tmp/ads-operations-gh-pages/
          printf 'deployed_at=%s\nsource_sha=%s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > /tmp/ads-operations-gh-pages/_pages_config_status.txt
          cd /tmp/ads-operations-gh-pages
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy validated static site from ${GITHUB_SHA}"
            git push origin gh-pages
          else
            echo "gh-pages is already current"
          fi