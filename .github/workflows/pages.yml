name: Deploy Ads Operations Integrity
# Legacy GitHub Pages deployment: publish the complete static site to gh-pages.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - "assets/**"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare complete static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site .validate
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source = Path('index.html')
          assets = Path('assets')
          loader = assets / 'private-cloud-warehouse-v3.js'
          if not source.exists() or source.stat().st_size < 1000:
              raise SystemExit('index.html is missing or unexpectedly small')
          if not loader.exists() or loader.stat().st_size < 1000:
              raise SystemExit('Cloud Warehouse loader is missing or unexpectedly small')

          data = source.read_bytes()
          fixes = (
              (b"newline: '\r\n'", b"newline: '\\r\\n'"),
              (b"newline: '\n'", b"newline: '\\r\\n'"),
          )
          applied = 0
          for broken, corrected in fixes:
              count = data.count(broken)
              if count:
                  data = data.replace(broken, corrected)
                  applied += count

          output = Path('_site')
          output.mkdir()
          (output / 'index.html').write_bytes(data)
          shutil.copytree(assets, output / 'assets')
          (output / '.nojekyll').write_text('', encoding='utf-8')
          print(f'Prepared {len(data):,} HTML bytes and complete assets; repaired {applied} broken newline literal(s)')
          PY
          test -f _site/assets/private-cloud-warehouse-v3.js

      - name: Extract inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.active = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script':
                      return
                  values = {k.lower(): (v or '') for k, v in attrs}
                  script_type = values.get('type', '').lower()
                  self.active = 'src' not in values and script_type in ('', 'text/javascript', 'application/javascript')
                  self.current = []

              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      self.scripts.append(''.join(self.current))
                      self.active = False
                      self.current = []

              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)

          html = Path('_site/index.html').read_text(encoding='utf-8')
          parser = ScriptExtractor()
          parser.feed(html)
          target = Path('.validate')
          target.mkdir(exist_ok=True)
          for index, script in enumerate(parser.scripts, 1):
              (target / f'inline-{index:03d}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(parser.scripts)} inline script(s)')
          PY

      - name: Validate JavaScript syntax and V4 origin
        shell: bash
        run: |
          set -euo pipefail
          find .validate -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --check _site/assets/private-cloud-warehouse-v3.js
          grep -q --fixed-strings "https://amazon-warehouse-cloud-v4.tanshiyuesir.workers.dev" _site/assets/private-cloud-warehouse-v3.js
          ! grep -R --line-number --fixed-strings "https://amazon-ad-private-api-v2.tanshiyuesir.workers.dev" _site/assets/private-cloud-warehouse-v3.js

      - name: Publish complete site to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show-ref --verify --quiet refs/heads/gh-pages || git fetch origin gh-pages:gh-pages
          rm -rf /tmp/ads-operations-gh-pages
          git worktree add /tmp/ads-operations-gh-pages gh-pages
          find /tmp/ads-operations-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. /tmp/ads-operations-gh-pages/
          printf 'deployed_at=%s\nsource_sha=%s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > /tmp/ads-operations-gh-pages/_pages_config_status.txt
          cd /tmp/ads-operations-gh-pages
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy complete static site from ${GITHUB_SHA}"
            git push origin gh-pages
          else
            echo "gh-pages is already current"
          fi
