name: CSV Analytics Focused CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cloudflare/runtime/csv-analytics-*.js'
      - 'assets/cloudflare-native-csv-*.js'
      - 'assets/cloudflare-native-api-v1.js'
      - 'assets/generated/inline-script-10.js'
      - 'scripts/csv-analytics-scale-harness.mjs'
      - 'scripts/test-csv-*.mjs'
      - '.github/workflows/csv-analytics-focused-ci.yml'
  push:
    branches:
      - main
      - 'feature/**'
      - 'perf/**'
    paths:
      - 'cloudflare/runtime/csv-analytics-*.js'
      - 'assets/cloudflare-native-csv-*.js'
      - 'assets/cloudflare-native-api-v1.js'
      - 'assets/generated/inline-script-10.js'
      - 'scripts/csv-analytics-scale-harness.mjs'
      - 'scripts/test-csv-*.mjs'
      - '.github/workflows/csv-analytics-focused-ci.yml'

permissions:
  contents: read

concurrency:
  group: csv-analytics-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: CSV analytics focused contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check analytics scale runtime
        run: |
          node --check cloudflare/runtime/csv-analytics-diagnostics-api.js
          node --check cloudflare/runtime/csv-analytics-recommendation-inbox.js
          node --check assets/cloudflare-native-csv-local-diagnostics-v1.js
          node --check assets/cloudflare-native-csv-recommendation-inbox-v1.js
          node --check assets/cloudflare-native-csv-recommendation-inbox-usability-v1.js
          node --check assets/cloudflare-native-csv-recommendation-operator-triage-v1.js
          node --check assets/cloudflare-native-csv-root-lifecycle-usability-v1.js
          node --check assets/cloudflare-native-csv-history-quarterly-operating-review-impl-v1.js
          node --check assets/cloudflare-native-csv-history-quarter-over-quarter-comparison-impl-v1.js
          node --check assets/cloudflare-native-csv-history-quarter-over-quarter-comparison-receipt-impl-v1.js
          node --check assets/cloudflare-native-csv-history-year-to-date-operating-review-impl-v1.js
          node --check assets/cloudflare-native-csv-history-year-over-year-ytd-comparison-impl-v1.js
          node --check assets/cloudflare-native-csv-history-rolling-12-operating-review-impl-v1.js
          node --check assets/cloudflare-native-csv-history-rolling-12-window-transition-review-impl-v1.js
          node --check assets/cloudflare-native-csv-history-comparison-receipt-impl-v1.js
          node --check assets/cloudflare-native-csv-history-comparison-receipt-verification-impl-v1.js
          node --check assets/cloudflare-native-api-v1.js
          node --check assets/generated/inline-script-10.js
          node --check cloudflare/runtime/web-entry.js
          node --check scripts/csv-analytics-scale-harness.mjs
          node --check scripts/test-csv-analytics-scale-harness.mjs
          node --check scripts/test-csv-analytics-request-dedupe.mjs
          node --check scripts/test-csv-diagnostics-financial-usability.mjs
          node --check scripts/test-csv-recommendation-inbox-contract.mjs
          node --check scripts/test-csv-recommendation-inbox-ui.mjs
          node --check scripts/test-csv-root-lifecycle-usability-ui.mjs
          node --check scripts/test-csv-root-lifecycle-accessibility.mjs
          node --check scripts/test-csv-history-ledger-module-identity.mjs
          node --check scripts/test-csv-history-remaining-module-identities.mjs
          node --check scripts/test-csv-history-live-module-identities.mjs
          node --check scripts/test-csv-history-final-module-identities.mjs
      - name: Validate existing analytics contract
        run: node scripts/test-csv-analytics-dashboard.mjs
      - name: Validate server-side full diagnostics contract
        run: node scripts/test-csv-server-side-diagnostics.mjs
      - name: Validate financial diagnostics operator usability
        run: node scripts/test-csv-diagnostics-financial-usability.mjs
      - name: Validate deterministic scale harness contract
        run: node scripts/test-csv-analytics-scale-harness.mjs
      - name: Validate in-flight analytics request dedupe contract
        run: node scripts/test-csv-analytics-request-dedupe.mjs
      - name: Validate governed recommendation inbox contract
        run: node scripts/test-csv-recommendation-inbox-contract.mjs
      - name: Validate Recommendation Inbox operator UI contract
        run: node scripts/test-csv-recommendation-inbox-ui.mjs
      - name: Validate Root and Lifecycle operator usability contract
        run: node scripts/test-csv-root-lifecycle-usability-ui.mjs
      - name: Validate Root and Lifecycle keyboard accessibility
        run: node scripts/test-csv-root-lifecycle-accessibility.mjs
      - name: Build canonical native artifact for History module identity
        run: npm run build:cf-native
      - name: Validate History Ledger module identity convergence
        run: node scripts/test-csv-history-ledger-module-identity.mjs
      - name: Validate remaining History module identity convergence
        run: node scripts/test-csv-history-remaining-module-identities.mjs
      - name: Validate live-discovered History module identity convergence
        run: node scripts/test-csv-history-live-module-identities.mjs
      - name: Validate final History module identity convergence
        run: node scripts/test-csv-history-final-module-identities.mjs
