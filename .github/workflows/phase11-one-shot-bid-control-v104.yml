name: Phase 11 One-shot Bid Control Parity v1.0.4

on:
  push:
    branches:
      - phase11/bid-control-parity-v104
    paths:
      - scripts/phase11_patch_bid_control_parity.py
      - .github/workflows/phase11-one-shot-bid-control-v104.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase11/bid-control-parity-v104
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Phase 11 patch
        run: python scripts/phase11_patch_bid_control_parity.py
      - name: Validate Phase 11 contracts
        run: |
          set -euo pipefail
          node --check assets/generated/inline-script-04.js
          node --check assets/bid-governance-parity-audit-v1.js
          node --check assets/private-cloud-query-v1.js
          node --check scripts/test-legacy-bid-control-source.mjs
          node --check scripts/test-bid-governance-parity-audit.mjs
          node --check scripts/test-progressive-loader.mjs
          node scripts/test-legacy-bid-control-source.mjs
          node scripts/test-bid-governance-parity-audit.mjs
          node scripts/test-progressive-loader.mjs
          git diff --check
      - name: Commit Phase 11 implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated/inline-script-04.js \
                  assets/bid-governance-parity-audit-v1.js \
                  assets/private-cloud-query-v1.js \
                  scripts/test-legacy-bid-control-source.mjs \
                  scripts/test-bid-governance-parity-audit.mjs \
                  scripts/test-progressive-loader.mjs
          git diff --cached --quiet && { echo 'No implementation changes'; exit 1; }
          git commit -m 'Phase 11: add independent Bid Control Parity v1.0.4'
          git push origin HEAD:phase11/bid-control-parity-v104
