name: Phase 4 Ads Dependency Inventory

on:
  push:
    branches: [phase4/query-native-ads-batch2]
    paths:
      - ".github/workflows/phase4-ads-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan ads module dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('assets/generated/inline-script-04.js'),
              Path('assets/generated/inline-script-05.js'),
              Path('assets/generated/inline-script-06.js'),
              Path('assets/generated/inline-script-07.js'),
              Path('assets/generated/inline-script-10.js'),
          ]
          patterns = {
              'DATA_ENTRY': re.compile(r'allAds|AdsDashboardApp|getFilteredData|getFilteredRows|getAdsRows|rawData|adsRows|adRows|filteredAds|currentAds|__LR_[A-Z0-9_]*(?:ADS|DATA|ROWS)', re.I),
              'MODULE_RENDER': re.compile(r'\b(?:function\s+|const\s+|let\s+)([A-Za-z_$][\w$]*(?:render|update|refresh|build|compute|calculate|recalc|hydrate)[\w$]*|(?:render|update|refresh|build|compute|calculate|recalc|hydrate)[A-Za-z_$][\w$]*)', re.I),
              'PUBLIC_API': re.compile(r'window\.[A-Za-z_$][\w$]*\s*=|Object\.freeze\(|debug\s*:', re.I),
              'FILTER_SCOPE': re.compile(r'dateStart|dateEnd|ShopScope|ACTIVE_SHOP|workspaceMarketplace|campaignFilter|matchType|searchTerm', re.I),
          }

          for path in files:
              if not path.exists():
                  continue
              lines = path.read_text(encoding='utf-8').splitlines()
              print(f'===== FILE {path} lines={len(lines)} =====')
              for label, pattern in patterns.items():
                  matches = []
                  for idx, line in enumerate(lines, 1):
                      if pattern.search(line):
                          matches.append(idx)
                  print(f'--- {label} count={len(matches)} ---')
                  for idx in matches[:250]:
                      start = max(1, idx - 2)
                      end = min(len(lines), idx + 2)
                      context = ' || '.join(f'{n}:{lines[n-1].strip()[:500]}' for n in range(start, end + 1))
                      print(context)
                  if len(matches) > 250:
                      print(f'... omitted {len(matches)-250} matches ...')
          PY
