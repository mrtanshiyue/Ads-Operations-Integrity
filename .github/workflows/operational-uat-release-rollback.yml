name: Operational UAT Release Rollback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/operational-uat-release-rollback.yml'

permissions:
  contents: read

concurrency:
  group: operational-uat-release-rollback-production
  cancel-in-progress: false

jobs:
  contracts:
    name: Operational UAT rollback contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/operational-uat-release-rollback.mjs
      - run: node --check scripts/test-operational-uat-release-rollback.mjs
      - run: node scripts/test-operational-uat-release-rollback.mjs

  live-production-drill:
    name: Production rollback and restore drill
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'ops/operational-uat-service-binding-rollback-20260820' &&
      github.event.pull_request.base.ref == 'main'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_GIT_SHA: 0ac14067229933aa10bdef615ee44d480c30c136
      RELEASE_TRACE_ENVIRONMENT: production
      RELEASE_TRACE_WORKER_NAME: ads-operations-web-prod
      RELEASE_TRACE_OUTPUT_PATH: artifacts/cloudflare-release-trace-production-pre-rollback.json
      RELEASE_TRACE_ATTEMPTS: '60'
      RELEASE_TRACE_DELAY_MS: '5000'
      OPERATIONAL_UAT_ROLLBACK_CONFIRM: ROLLBACK_AND_RESTORE_PRODUCTION
      OPERATIONAL_UAT_WORKER_NAME: ads-operations-web-prod
      OPERATIONAL_UAT_HEALTH_URL: https://op-uat-final-6cf43b216ec1.tanshiyuesir.workers.dev/api/health?cap=iWG69YgVBUzUPaxfxPLZOZ3SFW0e1k-U1-9AUpuHRlw
      OPERATIONAL_UAT_ROLLBACK_OUTPUT: artifacts/operational-uat-release-rollback.json
      OPERATIONAL_UAT_HEALTH_ATTEMPTS: '30'
      OPERATIONAL_UAT_HEALTH_DELAY_MS: '2000'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate rollback contract at execution commit
        run: |
          node --check scripts/operational-uat-release-rollback.mjs
          node scripts/test-operational-uat-release-rollback.mjs
      - name: Wait for exact main SHA to be live before rollback
        run: node scripts/generate-cloudflare-release-trace.mjs
      - name: Execute real production rollback and guaranteed restore
        run: node scripts/operational-uat-release-rollback.mjs
      - name: Upload immutable rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-uat-release-rollback-${{ github.run_id }}
          path: |
            artifacts/cloudflare-release-trace-production-pre-rollback.json
            artifacts/operational-uat-release-rollback.json
          if-no-files-found: warn
          retention-days: 90
