name: Operational UAT Release Rollback

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/operational-uat-release-rollback.mjs'
      - 'scripts/test-operational-uat-release-rollback.mjs'
      - '.github/workflows/operational-uat-release-rollback.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ROLLBACK_AND_RESTORE_PRODUCTION to run the production rollback drill'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: operational-uat-release-rollback-production
  cancel-in-progress: false

jobs:
  contracts:
    name: Operational UAT rollback contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/operational-uat-release-rollback.mjs
      - run: node --check scripts/test-operational-uat-release-rollback.mjs
      - run: node scripts/test-operational-uat-release-rollback.mjs

  live-production-drill:
    name: Production rollback and restore drill
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'ROLLBACK_AND_RESTORE_PRODUCTION'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPERATIONAL_UAT_ROLLBACK_CONFIRM: ${{ inputs.confirmation }}
      OPERATIONAL_UAT_WORKER_NAME: ads-operations-web-prod
      OPERATIONAL_UAT_HEALTH_URL: https://ads-operations-web-prod.tanshiyuesir.workers.dev/api/health
      OPERATIONAL_UAT_ROLLBACK_OUTPUT: artifacts/operational-uat-release-rollback.json
      OPERATIONAL_UAT_HEALTH_ATTEMPTS: '30'
      OPERATIONAL_UAT_HEALTH_DELAY_MS: '2000'
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate rollback contract at dispatched commit
        run: |
          node --check scripts/operational-uat-release-rollback.mjs
          node scripts/test-operational-uat-release-rollback.mjs
      - name: Execute real production rollback and guaranteed restore
        run: node scripts/operational-uat-release-rollback.mjs
      - name: Upload immutable rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-uat-release-rollback-${{ github.run_id }}
          path: artifacts/operational-uat-release-rollback.json
          if-no-files-found: warn
          retention-days: 90
