name: '#276 Dev Advisory Review Read-only Diagnostic — NEVER MERGE'

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/276-dev-advisory-review-readonly-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: '#276 SELECT-only advisory review governance inspection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 19cd528b5c32e8da423da3cf66a9f05d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      STORE_DB_ID: 123b2a32-d78b-4de9-8318-08e35cefb008
      REVIEW_FINGERPRINT: 6598e5cfb4fb610c77f0d53847660cadf79cde0b16f232fbec3c0fde6c6a3bf0
      WORKER: ads-operations-web-dev
      BASELINE_VERSION: bd3fcb2d-f4a7-4f04-afb3-b6287c17d32a
    steps:
      - name: SELECT-only trigger, review residue and runtime safety
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const db = process.env.STORE_DB_ID;
          const fingerprint = process.env.REVIEW_FINGERPRINT;
          const worker = process.env.WORKER;
          const baselineVersion = process.env.BASELINE_VERSION;
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function cf(path, {method='GET', body}={}) {
            const r = await fetch(`${api}${path}`, {
              method,
              headers: { authorization: `Bearer ${token}`, accept: 'application/json', ...(body ? {'content-type':'application/json'} : {}) },
              body: body ? JSON.stringify(body) : undefined,
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok || j?.success === false) throw new Error(`${path}:${r.status}:${j?.errors?.[0]?.message || ''}`);
            return j.result;
          }

          async function select(sql, params=[]) {
            if (!/^\s*(SELECT|PRAGMA)\b/i.test(sql)) throw new Error(`non_readonly_sql_rejected:${sql.slice(0,30)}`);
            const result = await cf(`/d1/database/${db}/query`, { method: 'POST', body: { sql, params } });
            const first = Array.isArray(result) ? result[0] : result;
            return { success: first?.success ?? true, results: first?.results || [], meta: first?.meta || null };
          }

          function binding(value, name) {
            if (!value || typeof value !== 'object') return null;
            if (Array.isArray(value)) {
              for (const x of value) {
                if (x && typeof x === 'object' && x.name === name) return x.text ?? x.value ?? null;
                const nested = binding(x, name); if (nested !== null) return nested;
              }
              return null;
            }
            for (const x of Object.values(value)) { const nested = binding(x, name); if (nested !== null) return nested; }
            return null;
          }

          const triggerRows = await select("SELECT name, sql FROM sqlite_master WHERE type='trigger' AND tbl_name='advisory_review_records' ORDER BY name");
          const tableRows = await select("SELECT name, sql FROM sqlite_master WHERE type='table' AND name='advisory_review_records'");
          const reviewRows = await select(`SELECT review_id, recommendation_fingerprint, state, note, reviewer_user_id, reviewed_at, created_at, updated_at, source_evidence_sha256 FROM advisory_review_records WHERE recommendation_fingerprint=?1 ORDER BY updated_at DESC, created_at DESC`, [fingerprint]);
          const optimization = await select('SELECT COUNT(*) AS count FROM optimization_actions');

          const depResult = await cf(`/workers/scripts/${encodeURIComponent(worker)}/deployments`);
          const dep = depResult?.deployments?.[0] || (Array.isArray(depResult) ? depResult[0] : null);
          const activeVersion = dep?.versions?.find(v => Number(v?.percentage)===100)?.version_id || dep?.versions?.[0]?.version_id || null;
          const baseline = await cf(`/workers/scripts/${encodeURIComponent(worker)}/versions/${encodeURIComponent(baselineVersion)}`);
          const schedulesResult = await cf(`/workers/scripts/${encodeURIComponent(worker)}/schedules`);
          const schedules = schedulesResult?.schedules ?? schedulesResult ?? [];

          const output = {
            triggerRows: triggerRows.results,
            tableDefinition: tableRows.results,
            currentReviewRows: reviewRows.results,
            optimizationActionCount: Number(optimization.results?.[0]?.count || 0),
            runtime: {
              activeDeploymentId: dep?.id || null,
              activeVersion,
              activePercentage: dep?.versions?.find(v => v.version_id===activeVersion)?.percentage ?? null,
              baselineVersion,
              baselineBindings: {
                accessMode: binding(baseline,'ACCESS_MODE'),
                syncTriggerEnabled: binding(baseline,'SYNC_TRIGGER_ENABLED'),
                phase5SingleRunPermitId: binding(baseline,'PHASE5_SINGLE_RUN_PERMIT_ID') ?? '',
                phase5SingleRunReportDate: binding(baseline,'PHASE5_SINGLE_RUN_REPORT_DATE') ?? '',
              },
              schedules: Array.isArray(schedules) ? schedules : [],
            },
          };
          console.log(JSON.stringify(output, null, 2));
          if (activeVersion !== baselineVersion) throw new Error(`dev_active_version_drift:${activeVersion}`);
          if (output.runtime.baselineBindings.accessMode !== 'off') throw new Error('dev_baseline_access_mode_not_off');
          if (output.runtime.baselineBindings.syncTriggerEnabled !== 'false') throw new Error('dev_sync_trigger_not_false');
          if (output.runtime.baselineBindings.phase5SingleRunPermitId !== '' || output.runtime.baselineBindings.phase5SingleRunReportDate !== '') throw new Error('dev_phase5_not_empty');
          if (output.runtime.schedules.length !== 0) throw new Error('dev_schedules_not_empty');
          NODE
