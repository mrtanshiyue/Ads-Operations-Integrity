name: Phase 8 One-shot Ad Product Scope Patch

on:
  push:
    branches: [phase8/parity-unproven-adproduct-diagnostic]
    paths: [.github/workflows/phase8-one-shot-adproduct-scope.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase8/parity-unproven-adproduct-diagnostic
      - name: Patch parity semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path); text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p='assets/bid-governance-parity-audit-v1.js'
          replace_once(p, "  const AUDIT_VERSION = '1.0.1';", "  const AUDIT_VERSION = '1.0.2';")
          replace_once(p,
            "      verdict: pass ? 'pass' : near ? 'warn' : 'fail', migrationCandidate: pass, executionAuthorized: false,",
            "      verdict: pass ? 'pass' : near ? 'warn' : 'fail', metricParityPass: pass, migrationCandidate: false, executionAuthorized: false,")
          replace_once(p,
            "      const payload = await window.QueryNativeModuleData.ads({ ...request, adProduct: 'SP', source: 'query', maxRows: MAX_ROWS, force });\n      if (payload?.source !== 'query-tidb') throw auditError(502, `Query 来源异常：${text(payload?.source) || 'missing'}`);\n      if (payload?.truncated === true || payload?.nextOffset) throw auditError(409, 'Query 结果达到分页上限，禁止用截断数据做 Parity 结论');\n      if (payload?.governance?.schemaVersion !== 'ads-query-governance-v2') throw auditError(502, 'Query governance v2 缺失');\n      const queryRows = Array.isArray(payload.rows) ? payload.rows : [];\n      const comparison = compareRows(legacy, queryRows);",
            "      const payload = await window.QueryNativeModuleData.ads({ ...request, adProduct: '', source: 'query', maxRows: MAX_ROWS, force });\n      if (payload?.source !== 'query-tidb') throw auditError(502, `Query 来源异常：${text(payload?.source) || 'missing'}`);\n      if (payload?.truncated === true || payload?.nextOffset) throw auditError(409, 'Query 结果达到分页上限，禁止用截断数据做 Parity 结论');\n      if (payload?.governance?.schemaVersion !== 'ads-query-governance-v2') throw auditError(502, 'Query governance v2 缺失');\n      const readiness = payload.governance?.readiness || {};\n      const adProductScopeProven = readiness.adProductReady === true;\n      const allQueryRows = Array.isArray(payload.rows) ? payload.rows : [];\n      const queryRows = adProductScopeProven\n        ? allQueryRows.filter(row => text(row?.adProduct).toUpperCase() === 'SP')\n        : allQueryRows;\n      const comparison = compareRows(legacy, queryRows);\n      comparison.adProductScopeProven = adProductScopeProven;\n      comparison.queryScopeMode = adProductScopeProven ? 'source-proven-sp' : 'unproven-ad-product-diagnostic';\n      comparison.scopeBlockers = adProductScopeProven ? [] : ['adProductReady'];\n      comparison.migrationCandidate = Boolean(comparison.metricParityPass && adProductScopeProven);")
          replace_once(p,
            "    if (verdict === 'pass') return 'Parity Pass · 仅迁移候选';",
            "    if (verdict === 'pass') return 'Metric Parity Pass';")
          replace_once(p,
            "    banner.textContent = `${verdictLabel(c.verdict)} · executionAuthorized=false · Query governance=${text(state.governance?.schemaVersion) || 'missing'}`;",
            "    banner.textContent = `${verdictLabel(c.verdict)} · ${c.adProductScopeProven ? 'SP scope source-proven' : 'Ad Product scope unproven · diagnostic only'} · migrationCandidate=${Boolean(c.migrationCandidate)} · executionAuthorized=false · Query governance=${text(state.governance?.schemaVersion) || 'missing'}`;")

          replace_once('assets/private-cloud-query-v1.js',
            "  const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1.0.1';",
            "  const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1.0.2';")
          replace_once('scripts/test-progressive-loader.mjs',
            "assert.match(query, /const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1\\.0\\.1'/);",
            "assert.match(query, /const BID_GOVERNANCE_PARITY_AUDIT_VERSION = '1\\.0\\.2'/);")
          replace_once('scripts/test-progressive-loader.mjs',
            "assert.match(parityAudit, /const AUDIT_VERSION = '1\\.0\\.1'/);",
            "assert.match(parityAudit, /const AUDIT_VERSION = '1\\.0\\.2'/);")
          PY
          node --check assets/bid-governance-parity-audit-v1.js
          node --check assets/private-cloud-query-v1.js
          node --check scripts/test-progressive-loader.mjs
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bid-governance-parity-audit-v1.js assets/private-cloud-query-v1.js scripts/test-progressive-loader.mjs
          git diff --cached --exit-code -- .github/workflows/phase8-one-shot-adproduct-scope.yml
          git commit -m "Phase 8: separate metric parity from Ad Product scope proof"
          git push origin HEAD:phase8/parity-unproven-adproduct-diagnostic
