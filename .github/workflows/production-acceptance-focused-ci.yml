name: Production Acceptance Focused CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production-four-store-acceptance.mjs'
      - 'scripts/test-production-four-store-acceptance.mjs'
      - '.github/workflows/production-acceptance-focused-ci.yml'
  push:
    branches: ['test/**']
    paths:
      - 'scripts/production-four-store-acceptance.mjs'
      - 'scripts/test-production-four-store-acceptance.mjs'
      - '.github/workflows/production-acceptance-focused-ci.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Production acceptance harness contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/production-four-store-acceptance.mjs
      - run: node --check scripts/test-production-four-store-acceptance.mjs
      - run: node scripts/test-production-four-store-acceptance.mjs
