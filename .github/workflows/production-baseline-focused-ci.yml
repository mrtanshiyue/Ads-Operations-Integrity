name: Production Baseline Focused CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production-baseline-v1.mjs'
      - 'scripts/test-production-baseline-v1.mjs'
      - '.github/workflows/production-baseline-focused-ci.yml'
  push:
    branches: ['release/**']
    paths:
      - 'scripts/production-baseline-v1.mjs'
      - 'scripts/test-production-baseline-v1.mjs'
      - '.github/workflows/production-baseline-focused-ci.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Production baseline live-truth contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/production-baseline-v1.mjs
      - run: node --check scripts/test-production-baseline-v1.mjs
      - run: node scripts/test-production-baseline-v1.mjs
