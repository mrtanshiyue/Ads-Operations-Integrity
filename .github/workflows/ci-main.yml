name: Validate Front-end Main

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: validate-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static site and security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git fetch --no-tags --prune origin phase4/query-native-ads-batch2
          git checkout -B phase4/query-native-ads-batch2 FETCH_HEAD

      - name: Apply adapter fix and push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/query-native-module-data-v1.js')
          text = path.read_text(encoding='utf-8')
          marker = "  const advancedSearchMatches = (value, query, exact = false) => {"
          helper = (
              "  const negativeTokenPresent = (value, token) => {\n"
              "    const normalized = lower(token);\n"
              "    if (!normalized) return false;\n"
              "    if (/^[a-z0-9]+$/i.test(normalized)) {\n"
              "      return lower(value).split(/[^a-z0-9]+/i).filter(Boolean).includes(normalized);\n"
              "    }\n"
              "    return lower(value).includes(normalized);\n"
              "  };\n\n"
          )
          old = "&& negatives.every(token => !haystack.includes(token));"
          new = "&& negatives.every(token => !negativeTokenPresent(value, token));"
          if 'const negativeTokenPresent' not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'advanced search marker count={text.count(marker)}')
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('negative boundary fix missing')
          path.write_text(text, encoding='utf-8')
          PY
          node --check assets/query-native-module-data-v1.js
          node scripts/test-progressive-loader.mjs
          node scripts/test-query-native-modules.mjs
          node scripts/test-query-native-ads-trend.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/query-native-module-data-v1.js
          if git diff --cached --quiet; then
            echo 'Adapter already fixed'
            exit 0
          fi
          git commit -m 'Fix negative search token boundaries'
          git push origin HEAD:phase4/query-native-ads-batch2
