name: Validate Front-end Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static site and security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build validation tree
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/private-cloud-warehouse-v4.js
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp -a assets/. _site/assets/
          : > _site/.nojekyll

      - name: Validate maintained JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/private-cloud-warehouse-v3.js
          node --check assets/private-cloud-warehouse-v4.js
          node --check scripts/harden-static-site.mjs
          find assets/generated -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check

      - name: Verify locked vendor bytes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('scripts/vendor-lock.json', 'utf8'));
          for (const vendor of lock.vendors || []) {
            const bytes = readFileSync(vendor.path);
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (digest !== vendor.sha256) throw new Error(`Vendor digest mismatch: ${vendor.name}`);
          }
          console.log(`Verified ${lock.vendors.length} vendor files`);
          NODE

      - name: Verify same-origin CSP and dependency isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class SecurityParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.sources = []
                  self.inline_executable = 0
                  self.csp = []
              def handle_starttag(self, tag, attrs):
                  values = {key.lower(): (value or '') for key, value in attrs}
                  if tag.lower() == 'meta' and values.get('http-equiv', '').lower() == 'content-security-policy':
                      self.csp.append(values.get('content', ''))
                  if tag.lower() != 'script':
                      return
                  source = values.get('src', '')
                  if source:
                      self.sources.append(source)
                  elif values.get('type', '').lower() in ('', 'text/javascript', 'application/javascript', 'module'):
                      self.inline_executable += 1

          html = Path('index.html').read_text(encoding='utf-8')
          parser = SecurityParser(); parser.feed(html)
          if len(parser.csp) != 1:
              raise SystemExit(f'Expected one CSP meta policy, found {len(parser.csp)}')
          policy = parser.csp[0]
          required = ["script-src 'self'", "script-src-attr 'none'", "object-src 'none'", "connect-src 'self' https://amazon-warehouse-cloud-v4.tanshiyuesir.workers.dev"]
          for directive in required:
              if directive not in policy:
                  raise SystemExit(f'CSP directive missing: {directive}')
          remote = [source for source in parser.sources if re.match(r'^https?://', source, re.I)]
          if remote:
              raise SystemExit(f'Remote scripts remain: {remote}')
          if parser.inline_executable:
              raise SystemExit(f'Executable inline scripts remain: {parser.inline_executable}')
          if re.search(r'cdn\.jsdelivr\.net|cdn\.sheetjs\.com|cdnjs\.cloudflare\.com', html, re.I):
              raise SystemExit('CDN URL remains in index.html')
          PY

      - name: Verify V4 production and credential invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "warehouse-v4-production" assets/private-cloud-warehouse-v4.js
          grep -Fq "private-cloud-warehouse-v4.js" assets/private-cloud-warehouse-v3.js
          grep -Fq "FETCH_CONCURRENCY = 3" assets/private-cloud-warehouse-v4.js
          grep -Fq "/summary?scope=" assets/private-cloud-warehouse-v4.js
          grep -Fq "setPassword: value => memoryCredential.set(value)" assets/private-cloud-warehouse-v4.js
          grep -Fq "const LOADER_VERSION = '4.1.1'" assets/private-cloud-warehouse-v4.js
          ! grep -Fq "warehouse-v4-canary" assets/private-cloud-warehouse-v4.js
          ! grep -Eq "lr_private_cloud_password|sessionStorage|const sessionSafe" assets/private-cloud-warehouse-v4.js
          ! grep -Eq "\^\(3\|4\)|startsWith\(['\"]3" assets/private-cloud-warehouse-v4.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class ExternalScripts(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script': return
                  values = {key.lower(): (value or '') for key, value in attrs}
                  if values.get('src'): self.sources.append(values['src'])

          parser = ExternalScripts(); parser.feed(Path('index.html').read_text(encoding='utf-8'))
          expected = 'assets/private-cloud-warehouse-v4.js'
          count = sum(source == expected for source in parser.sources)
          if count != 1:
              raise SystemExit(f'Expected exactly one formal V4 loader reference, found {count}')

          loader = Path('assets/private-cloud-warehouse-v4.js').read_text(encoding='utf-8')
          start = loader.find('  const bindUi = () => {')
          end = loader.find('\n\n  const requestPassword', start)
          section = loader[start:end] if start >= 0 and end >= 0 else ''
          if section.count('event.stopImmediatePropagation();') != 1 or '}, true);' not in section:
              raise SystemExit('V4 loader does not own the import controls in capture phase')
          PY

      - name: Reject completed repair artifacts
        shell: bash
        run: |
          set -euo pipefail
          transient="$(find .github .diagnostics -type f \( -name '*.trigger' -o -name '*-result.json' -o -name '*canary*.json' -o -name '*.log' -o -name '*repair*.txt' -o -name '*context*.txt' \) -print 2>/dev/null || true)"
          if [ -n "$transient" ]; then
            echo "Completed repair artifact(s) remain in the active tree:"
            printf '%s\n' "$transient"
            exit 1
          fi

      - name: Verify Pages artifact contains all application assets
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/assets/private-cloud-warehouse-v3.js
          test -s _site/assets/private-cloud-warehouse-v4.js
          test -s _site/assets/vendor/xlsx.full.min.js
          test -s _site/assets/vendor/html2pdf.bundle.min.js
          test -s _site/assets/generated/inline-script-01.js
