name: Live #229 Browser Acceptance

on:
  push:
    branches:
      - feature/229-live-browser-acceptance
    paths:
      - 'scripts/live-229-browser-acceptance.mjs'
      - '.github/workflows/live-229-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser-acceptance:
    name: Live Chromium interaction acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEV_BASE_URL: https://ads-operations-web-dev.tanshiyuesir.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute live #229 browser acceptance
        run: node scripts/live-229-browser-acceptance.mjs
      - name: Upload live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-229-browser-acceptance
          path: artifacts/live-229-browser-acceptance
          if-no-files-found: error
          retention-days: 30
