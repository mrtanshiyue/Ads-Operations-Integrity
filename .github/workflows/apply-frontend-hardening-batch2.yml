name: Apply Front-end Security Batch 2

on:
  push:
    branches:
      - fix/frontend-security-batch2-2026-08-05
    paths:
      - scripts/vendor-lock.json
      - scripts/harden-static-site.mjs
      - .github/workflows/apply-frontend-hardening-batch2.yml

permissions:
  contents: write

concurrency:
  group: apply-frontend-security-batch2
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-security-batch2-2026-08-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download exact vendor bytes and verify SHA-256
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          const lock = JSON.parse(readFileSync('scripts/vendor-lock.json', 'utf8'));
          for (const vendor of lock.vendors || []) {
            const response = await fetch(vendor.url, { redirect: 'follow' });
            if (!response.ok) throw new Error(`Vendor download failed ${response.status}: ${vendor.name}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (digest !== vendor.sha256) throw new Error(`Vendor digest mismatch: ${vendor.name}`);
            mkdirSync(dirname(vendor.path), { recursive: true });
            writeFileSync(vendor.path, bytes);
            console.log(`${vendor.name}: ${bytes.length} bytes · ${digest}`);
          }
          NODE
      - name: Harden index and V4 credential handling
        run: node scripts/harden-static-site.mjs
      - name: Validate hardened output
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/private-cloud-warehouse-v4.js
          node --check scripts/harden-static-site.mjs
          test -f assets/vendor/xlsx.full.min.js
          test -f assets/vendor/html2pdf.bundle.min.js
          ! grep -Eqi 'cdn\.jsdelivr\.net|cdn\.sheetjs\.com|cdnjs\.cloudflare\.com' index.html
          ! grep -Eq 'lr_private_cloud_password|sessionStorage' assets/private-cloud-warehouse-v4.js
          grep -Fq "script-src 'self'" index.html
      - name: Remove temporary batch workflows
        run: rm -f .github/workflows/security-inventory-batch2.yml .github/workflows/apply-frontend-hardening-batch2.yml
      - name: Commit hardened static site to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets scripts .github/workflows
          git commit -m "Harden front-end dependencies, CSP and credential storage"
          git push origin HEAD:fix/frontend-security-batch2-2026-08-05
