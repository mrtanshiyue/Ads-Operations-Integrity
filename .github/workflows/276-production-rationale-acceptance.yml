name: '#276 Production Exact-Main Human Review Rationale Acceptance — NEVER MERGE'

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/issue-276-production-rationale-acceptance.mjs'
      - '.github/workflows/276-production-rationale-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: issue-276-production-rationale-acceptance
  cancel-in-progress: false

jobs:
  production-rationale-acceptance:
    name: '#276 exact-main Production promotion + rationale acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_MAIN_SHA: 67b1a1daf403b971006bdd8aa66d6336a5e56832
      CLOUDFLARE_ACCOUNT_ID: 19cd528b5c32e8da423da3cf66a9f05d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      ACCEPTANCE_CREDENTIAL_PRESENT: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require dedicated acceptance credential
        if: env.ACCEPTANCE_CREDENTIAL_PRESENT != 'true'
        run: exit 1
      - name: Pin protected canonical main
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$ACTUAL_SHA" = "$EXPECTED_MAIN_SHA"
      - name: Static harness check
        run: node --check scripts/issue-276-production-rationale-acceptance.mjs
      - name: Promote exact main and run Production rationale acceptance
        run: node scripts/issue-276-production-rationale-acceptance.mjs
      - name: Upload immutable Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-276-production-rationale-acceptance-${{ github.run_id }}
          path: artifacts/issue-276-production-rationale-acceptance/receipt.json
          if-no-files-found: error
          retention-days: 90
