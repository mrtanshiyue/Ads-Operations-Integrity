name: Operational UAT Focused CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/operational-uat-failure-recovery.mjs'
      - 'scripts/test-operational-uat-failure-recovery.mjs'
      - 'cloudflare/runtime/operational-uat-live-probe.js'
      - 'cloudflare/runtime/operational-uat-ephemeral-service-route.js'
      - 'cloudflare/runtime/runtime-observed-entry.js'
      - 'cloudflare/runtime/wrangler.native.jsonc'
      - 'src/access.js'
      - 'scripts/test-operational-uat-live-probe.mjs'
      - 'scripts/test-operational-uat-secondary-access-aud.mjs'
      - '.github/workflows/operational-uat-focused-ci.yml'
  push:
    branches: ['test/**', 'feature/**']
    paths:
      - 'scripts/operational-uat-failure-recovery.mjs'
      - 'scripts/test-operational-uat-failure-recovery.mjs'
      - 'cloudflare/runtime/operational-uat-live-probe.js'
      - 'cloudflare/runtime/operational-uat-ephemeral-service-route.js'
      - 'cloudflare/runtime/runtime-observed-entry.js'
      - 'cloudflare/runtime/wrangler.native.jsonc'
      - 'src/access.js'
      - 'scripts/test-operational-uat-live-probe.mjs'
      - 'scripts/test-operational-uat-secondary-access-aud.mjs'
      - '.github/workflows/operational-uat-focused-ci.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Operational UAT failure recovery contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/operational-uat-failure-recovery.mjs
      - run: node --check scripts/test-operational-uat-failure-recovery.mjs
      - run: node --check cloudflare/runtime/operational-uat-live-probe.js
      - run: node --check cloudflare/runtime/operational-uat-ephemeral-service-route.js
      - run: node --check cloudflare/runtime/runtime-observed-entry.js
      - run: node --check src/access.js
      - run: node --check scripts/test-operational-uat-live-probe.mjs
      - run: node --check scripts/test-operational-uat-secondary-access-aud.mjs
      - run: node scripts/test-operational-uat-failure-recovery.mjs
      - run: node scripts/test-operational-uat-live-probe.mjs
      - run: node scripts/test-operational-uat-secondary-access-aud.mjs
