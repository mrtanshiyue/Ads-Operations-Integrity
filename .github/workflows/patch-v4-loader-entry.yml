name: Patch V4 Loader Entry

on:
  push:
    branches: [phase-5-7-frontend-optimization-2026-08-05]
    paths:
      - .github/patch/v4-loader-entry.trigger

permissions:
  contents: write

concurrency:
  group: patch-v4-loader-entry
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: phase-5-7-frontend-optimization-2026-08-05
          fetch-depth: 1

      - name: Patch loader entry and event ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          loader_path = Path('assets/private-cloud-warehouse-v4.js')
          html = index_path.read_text(encoding='utf-8')
          loader = loader_path.read_text(encoding='utf-8')

          script_pattern = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\']assets/private-cloud-warehouse-v4\.js["\'])[^>]*>\s*</script>',
              re.IGNORECASE,
          )
          matches = list(script_pattern.finditer(html))
          if len(matches) > 1:
              raise SystemExit(f'Expected at most one formal V4 loader tag, found {len(matches)}')
          if not matches:
              position = html.lower().rfind('</body>')
              if position < 0:
                  position = html.lower().rfind('</html>')
              if position < 0:
                  raise SystemExit('index.html has no closing body/html tag')
              html = html[:position] + '  <script src="assets/private-cloud-warehouse-v4.js"></script>\n' + html[position:]

          start_marker = "  const bindUi = () => {"
          end_marker = "\n\n  const requestPassword"
          start = loader.find(start_marker)
          end = loader.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate bindUi function boundaries')
          section = loader[start:end]
          if 'event.stopImmediatePropagation();' not in section:
              section, count = re.subn(
                  r'(\n\s*if \(!target\) return;)',
                  r'\1\n      event.preventDefault();\n      event.stopImmediatePropagation();',
                  section,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not locate the button target guard')
          if '}, true);' not in section:
              close_position = section.rfind('\n    });')
              if close_position < 0:
                  raise SystemExit('Could not locate the bindUi event listener closing line')
              section = section[:close_position] + '\n    }, true);' + section[close_position + len('\n    });'):]
          if section.count('event.stopImmediatePropagation();') != 1 or '}, true);' not in section:
              raise SystemExit('Capture-phase event ownership validation failed')
          loader = loader[:start] + section + loader[end:]

          index_path.write_text(html, encoding='utf-8')
          loader_path.write_text(loader, encoding='utf-8')

          final_matches = list(script_pattern.finditer(html))
          if len(final_matches) != 1:
              raise SystemExit(f'Expected exactly one formal V4 loader tag, found {len(final_matches)}')
          body_end = html.lower().rfind('</body>')
          if body_end >= 0 and final_matches[0].start() > body_end:
              raise SystemExit('Formal V4 loader tag is outside the body')
          print('Formal V4 loader entry and capture-phase event ownership are installed.')
          PY

          node --check assets/private-cloud-warehouse-v4.js

      - name: Commit candidate patch and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-v4-loader-entry.yml .github/patch/v4-loader-entry.trigger
          git add index.html assets/private-cloud-warehouse-v4.js
          git diff --cached --check
          git commit -m "Load the formal Warehouse V4 runtime from the application"
          git push origin HEAD:phase-5-7-frontend-optimization-2026-08-05
