name: Phase 4 Negative Search One-shot Fix

on:
  push:
    branches: [phase4/query-native-ads-batch2]
    paths:
      - ".github/workflows/phase4-fix-negative-search-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git fetch --no-tags --prune --depth=1 origin phase4/query-native-ads-batch2
          git checkout -B phase4/query-native-ads-batch2 FETCH_HEAD

      - name: Fix negative token boundary and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/query-native-module-data-v1.js')
          text = path.read_text(encoding='utf-8')
          marker = "  const advancedSearchMatches = (value, query, exact = false) => {"
          helper = """  const negativeTokenPresent = (value, token) => {
            const normalized = lower(token);
            if (!normalized) return false;
            if (/^[a-z0-9]+$/i.test(normalized)) {
              return lower(value).split(/[^a-z0-9]+/i).filter(Boolean).includes(normalized);
            }
            return lower(value).includes(normalized);
          };

"""
          predicate = "&& negatives.every(token => !haystack.includes(token));"
          replacement = "&& negatives.every(token => !negativeTokenPresent(value, token));"
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one advanced search marker, found {text.count(marker)}')
          if text.count(predicate) != 1:
              raise SystemExit(f'Expected one negative predicate, found {text.count(predicate)}')
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(predicate, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check assets/query-native-module-data-v1.js
          node scripts/test-progressive-loader.mjs
          node scripts/test-query-native-modules.mjs
          node scripts/test-query-native-ads-trend.mjs

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase4-fix-negative-search-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/query-native-module-data-v1.js
          git commit -m "Fix negative search token boundaries"
          git push origin HEAD:phase4/query-native-ads-batch2
