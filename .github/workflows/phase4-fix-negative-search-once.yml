name: Phase 4 Negative Search One-shot Fix

on:
  push:
    branches: [phase4/query-native-ads-batch2]
    paths:
      - ".github/workflows/phase4-fix-negative-search-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git fetch --no-tags --prune --depth=1 origin phase4/query-native-ads-batch2
          git checkout -B phase4/query-native-ads-batch2 FETCH_HEAD

      - name: Fix negative token boundary and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/query-native-module-data-v1.js')
          text = path.read_text(encoding='utf-8')
          old = """  const advancedSearchMatches = (value, query, exact = false) => {
            const haystack = lower(value);
            const needle = text(query);
            if (!needle) return true;
            if (exact) return haystack === needle.toLowerCase();
            if (/^regex:/i.test(needle)) {
              const pattern = needle.slice(6).trim();
              if (!pattern) return true;
              try { return new RegExp(pattern, 'i').test(value); }
              catch (_) { throw moduleError(400, '搜索词正则表达式无效'); }
            }
            const tokens = needle.split(/\\s+/).filter(Boolean);
            const positives = tokens.filter(token => !token.startsWith('-')).map(lower);
            const negatives = tokens.filter(token => token.startsWith('-') && token.length > 1).map(token => lower(token.slice(1)));
            return positives.every(token => haystack.includes(token))
              && negatives.every(token => !haystack.includes(token));
          };
          """
          new = """  const escapeRegExp = value => String(value || '').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');

          const negativeTokenPresent = (value, token) => {
            const source = String(value || '');
            const normalized = lower(token);
            if (!normalized) return false;
            if (/^[a-z0-9]+$/i.test(normalized)) {
              return new RegExp(`(?:^|[^a-z0-9])${escapeRegExp(normalized)}(?:$|[^a-z0-9])`, 'i').test(source);
            }
            return lower(source).includes(normalized);
          };

          const advancedSearchMatches = (value, query, exact = false) => {
            const haystack = lower(value);
            const needle = text(query);
            if (!needle) return true;
            if (exact) return haystack === needle.toLowerCase();
            if (/^regex:/i.test(needle)) {
              const pattern = needle.slice(6).trim();
              if (!pattern) return true;
              try { return new RegExp(pattern, 'i').test(value); }
              catch (_) { throw moduleError(400, '搜索词正则表达式无效'); }
            }
            const tokens = needle.split(/\\s+/).filter(Boolean);
            const positives = tokens.filter(token => !token.startsWith('-')).map(lower);
            const negatives = tokens.filter(token => token.startsWith('-') && token.length > 1).map(token => lower(token.slice(1)));
            return positives.every(token => haystack.includes(token))
              && negatives.every(token => !negativeTokenPresent(value, token));
          };
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one advanced search block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check assets/query-native-module-data-v1.js
          node scripts/test-progressive-loader.mjs
          node scripts/test-query-native-modules.mjs
          node scripts/test-query-native-ads-trend.mjs

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase4-fix-negative-search-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/query-native-module-data-v1.js
          git commit -m "Fix negative search token boundaries"
          git push origin HEAD:phase4/query-native-ads-batch2
