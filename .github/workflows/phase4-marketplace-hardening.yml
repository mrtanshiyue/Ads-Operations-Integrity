name: Phase 4 Marketplace Hardening

on:
  push:
    branches: [phase4/query-native-finance-batch1]
    paths:
      - "tools/phase4_harden_query_native_marketplace.py"
      - ".github/workflows/phase4-marketplace-hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply marketplace hardening
        run: python3 tools/phase4_harden_query_native_marketplace.py
      - name: Validate Query-native contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/query-native-module-data-v1.js
          node --check assets/generated/inline-script-08.js
          node --check scripts/test-query-native-modules.mjs
          node scripts/test-progressive-loader.mjs
          node scripts/test-query-native-modules.mjs
      - name: Commit marketplace hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/query-native-module-data-v1.js assets/generated/inline-script-08.js scripts/test-query-native-modules.mjs
          git commit -m "Harden Query-native marketplace mapping"
          git push origin HEAD:phase4/query-native-finance-batch1
