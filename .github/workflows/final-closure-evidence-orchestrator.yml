name: Final Closure Evidence Orchestrator

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/final-closure-evidence-contract.mjs'
      - 'scripts/final-closure-control-plane.mjs'
      - 'scripts/final-closure-evidence-orchestrator.mjs'
      - 'scripts/test-final-closure-evidence-orchestrator.mjs'
      - '.github/workflows/final-closure-evidence-orchestrator.yml'
  push:
    branches:
      - 'feature/final-closure-evidence-orchestrator-v1'
      - 'test/final-closure-evidence/**'
    paths:
      - 'scripts/final-closure-evidence-contract.mjs'
      - 'scripts/final-closure-control-plane.mjs'
      - 'scripts/final-closure-evidence-orchestrator.mjs'
      - 'scripts/test-final-closure-evidence-orchestrator.mjs'
      - '.github/workflows/final-closure-evidence-orchestrator.yml'
      - '.github/final-closure-run-request.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'readiness records blockers without failing; formal fails closed until every closure gate is green'
        required: true
        default: readiness
        type: choice
        options:
          - readiness
          - formal

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: final-closure-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Final closure evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check scripts/final-closure-evidence-contract.mjs
          node --check scripts/final-closure-control-plane.mjs
          node --check scripts/final-closure-evidence-orchestrator.mjs
          node --check scripts/test-final-closure-evidence-orchestrator.mjs
      - name: Validate fail-close composition contract
        run: node scripts/test-final-closure-evidence-orchestrator.mjs

  live-evidence:
    name: Live final closure evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FINAL_CLOSURE_OUTPUT_DIR: artifacts/final-closure-evidence
      FINAL_CLOSURE_STRICT: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'formal') || startsWith(github.ref, 'refs/heads/test/final-closure-evidence/formal-') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect canonical-main and live control-plane evidence
        run: node scripts/final-closure-evidence-orchestrator.mjs
      - name: Upload immutable readiness/formal evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-closure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/final-closure-evidence/
          if-no-files-found: error
          retention-days: 90

  trusted-readiness-relay:
    name: Trusted push readiness relay
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Locate completed trusted push run for this exact head
        id: trusted
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            payload="$(gh api --method GET "repos/${GH_REPO}/actions/workflows/final-closure-evidence-orchestrator.yml/runs" -f event=push -f branch="${HEAD_BRANCH}" -f per_page=20)"
            run_id="$(jq -r --arg sha "${HEAD_SHA}" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${payload}")"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "${run_id}" ]]; then
            echo 'TRUSTED_PUSH_READINESS_RUN_NOT_FOUND'
            exit 1
          fi
          conclusion="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}" --jq '.conclusion // empty')"
          if [[ "${conclusion}" != 'success' ]]; then
            echo "TRUSTED_PUSH_READINESS_RUN_NOT_SUCCESS:${run_id}:${conclusion}"
            exit 1
          fi
          artifact_name="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("final-closure-evidence-")))] | sort_by(.created_at) | reverse | .[0].name // empty')"
          if [[ -z "${artifact_name}" ]]; then
            echo "TRUSTED_PUSH_READINESS_ARTIFACT_NOT_FOUND:${run_id}"
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Download and fingerprint trusted readiness snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trusted-push-readiness relay
          gh run download "${{ steps.trusted.outputs.run_id }}" --repo "${GH_REPO}" --name "${{ steps.trusted.outputs.artifact_name }}" --dir trusted-push-readiness
          test -f trusted-push-readiness/snapshot.json
          cp trusted-push-readiness/snapshot.json relay/snapshot.json
          sha256sum relay/snapshot.json | awk '{print $1}' > relay/snapshot.sha256
          jq -n \
            --arg sourceRunId '${{ steps.trusted.outputs.run_id }}' \
            --arg sourceArtifact '${{ steps.trusted.outputs.artifact_name }}' \
            --arg sourceHeadSha "${HEAD_SHA}" \
            --arg sourceBranch "${HEAD_BRANCH}" \
            --arg snapshotSha256 "$(cat relay/snapshot.sha256)" \
            '{schemaVersion:"trusted-push-readiness-relay-v1",sourceRunId:$sourceRunId,sourceArtifact:$sourceArtifact,sourceHeadSha:$sourceHeadSha,sourceBranch:$sourceBranch,snapshotSha256:$snapshotSha256}' \
            > relay/source.json
          jq '{schemaVersion,status,mainSha,blockers}' relay/snapshot.json

      - name: Upload trusted readiness relay
        uses: actions/upload-artifact@v4
        with:
          name: trusted-push-readiness-relay-${{ github.run_id }}
          path: relay/
          if-no-files-found: error
          retention-days: 90
