name: Patch Private Cloud Overview Layout

on:
  push:
    branches: [fix/private-cloud-overview-layout-v1]
    paths:
      - "tools/patch_private_cloud_overview_layout.py"
      - ".github/workflows/patch-private-cloud-overview-layout.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply deterministic layout patch
        run: python3 tools/patch_private_cloud_overview_layout.py
      - name: Validate patched assets
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/private-cloud-warehouse-v4.js
          node --check scripts/test-progressive-loader.mjs
          node scripts/test-progressive-loader.mjs
          grep -Fq '<script src="assets/private-cloud-warehouse-v4.js"></script>' index.html
          grep -Fq "const LOADER_VERSION = '4.3.0'" assets/private-cloud-warehouse-v4.js
          grep -Fq 'panel.insertBefore(card, statusHost || null)' assets/private-cloud-warehouse-v4.js
          grep -Fq '#privateCloudImportPanel > .privateCloudActions' assets/private-cloud-warehouse-v4.js
      - name: Commit patched runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/private-cloud-warehouse-v4.js scripts/test-progressive-loader.mjs
          git commit -m "Normalize private cloud layout hotfix versioning"
          git push origin HEAD:fix/private-cloud-overview-layout-v1
