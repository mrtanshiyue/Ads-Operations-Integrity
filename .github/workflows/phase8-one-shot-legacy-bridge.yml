name: Phase 8 One-shot Legacy Bridge Patch

on:
  push:
    branches:
      - phase8/legacy-parity-read-bridge
    paths:
      - .github/workflows/phase8-one-shot-legacy-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase8/legacy-parity-read-bridge

      - name: Insert exact read-only parity bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/generated/inline-script-04.js')
          source = path.read_text(encoding='utf-8')
          anchor = '    getTransactionRowsForFinance:()=>AdsStore.transactions,\n'
          bridge = '    getBidGovernanceScopedRowsForParity:()=>getBidGovScopedRows("searchTerm").map(row=>({...row})),\n'
          if bridge in source:
              raise SystemExit('Parity bridge already exists; refusing duplicate patch')
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one transaction getter anchor, found {source.count(anchor)}')
          patched = source.replace(anchor, anchor + bridge, 1)
          if patched.count(bridge) != 1:
              raise SystemExit('Parity bridge insertion count is not exactly one')
          path.write_text(patched, encoding='utf-8')
          PY
          node --check assets/generated/inline-script-04.js
          git diff --check -- assets/generated/inline-script-04.js
          test "$(git diff --numstat -- assets/generated/inline-script-04.js | awk '{print $1":"$2}')" = "1:0"

      - name: Commit bridge only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/inline-script-04.js
          git diff --cached --exit-code -- .github/workflows/phase8-one-shot-legacy-bridge.yml
          git commit -m "Phase 8: expose read-only legacy parity rows"
          git push origin HEAD:phase8/legacy-parity-read-bridge
