name: Phase 12 One-shot Trend Chart Lifecycle

on:
  push:
    branches:
      - phase12/trend-chart-lifecycle-fix
    paths:
      - scripts/phase12_patch_trend_chart_lifecycle.py
      - .github/workflows/phase12-one-shot-trend-chart-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase12/trend-chart-lifecycle-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply lifecycle patch
        run: python scripts/phase12_patch_trend_chart_lifecycle.py
      - name: Validate lifecycle contracts
        run: |
          set -euo pipefail
          node --check assets/generated/inline-script-04.js
          node --check scripts/test-trend-chart-lifecycle.mjs
          node --check scripts/test-progressive-loader.mjs
          node scripts/test-trend-chart-lifecycle.mjs
          node scripts/test-progressive-loader.mjs
          git diff --check
      - name: Commit maintained implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated/inline-script-04.js \
                  scripts/test-trend-chart-lifecycle.mjs \
                  scripts/test-progressive-loader.mjs
          git diff --cached --quiet && { echo 'No implementation changes'; exit 1; }
          git commit -m 'Phase 12: reconcile trend Chart lifecycle ownership'
          git push origin HEAD:phase12/trend-chart-lifecycle-fix
