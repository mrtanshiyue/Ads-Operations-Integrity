name: Update Progressive Production README

on:
  push:
    branches: [docs/progressive-production-baseline]
    paths:
      - ".github/workflows/update-progressive-readme.yml"
      - "tools/update_progressive_readme.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README
        run: python3 tools/update_progressive_readme.py
      - name: Commit README only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document progressive Frontend production baseline"
          git push origin HEAD:docs/progressive-production-baseline
