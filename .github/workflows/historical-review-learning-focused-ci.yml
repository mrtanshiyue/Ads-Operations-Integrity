name: Historical Review Learning Focused CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cloudflare/runtime/historical-review-learning.js'
      - 'cloudflare/runtime/csv-recommendation-human-review-api.js'
      - 'scripts/test-historical-review-learning.mjs'
      - 'scripts/test-historical-review-learning-integration.mjs'
      - '.github/workflows/historical-review-learning-focused-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-review-learning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Historical Review Learning v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check historical learning projection
        run: |
          node --check cloudflare/runtime/historical-review-learning.js
          node --check cloudflare/runtime/csv-recommendation-human-review-api.js
          node --check scripts/test-historical-review-learning.mjs
          node --check scripts/test-historical-review-learning-integration.mjs

      - name: Validate historical learning semantics and integration
        run: |
          node scripts/test-historical-review-learning.mjs
          node scripts/test-historical-review-learning-integration.mjs
