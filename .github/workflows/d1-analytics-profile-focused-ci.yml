name: D1 Analytics Profile Focused CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/performance/d1-analytics-profile-*.json'
      - 'scripts/test-d1-analytics-profile-receipt.mjs'
      - '.github/workflows/d1-analytics-profile-focused-ci.yml'
  push:
    branches: ['perf/**']
    paths:
      - 'docs/performance/d1-analytics-profile-*.json'
      - 'scripts/test-d1-analytics-profile-receipt.mjs'
      - '.github/workflows/d1-analytics-profile-focused-ci.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: D1 analytics profile receipt contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/test-d1-analytics-profile-receipt.mjs
      - run: node scripts/test-d1-analytics-profile-receipt.mjs
