name: Temporary Final Disposition PR Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-final-disposition-pr-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/human-review-final-disposition-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-review-final-disposition-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and execute fail-closed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-final-disposition-bootstrap.yml').read_text()
          start = text.index("          node <<'NODE'\n") + len("          node <<'NODE'\n")
          end = text.index("\n          NODE\n", start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          script = script.replace('${', r'\${')
          Path('/tmp/final-disposition-patch.js').write_text(script)
          PY
          node /tmp/final-disposition-patch.js
          python3 - <<'PY'
          from pathlib import Path

          migration_test = Path('scripts/test-human-review-final-disposition.mjs')
          text = migration_test.read_text()
          old = "assert.deepEqual(db.prepare('SELECT review_id,state FROM advisory_review_records ORDER BY review_id').all(), ["
          new = "assert.deepEqual(db.prepare('SELECT review_id,state FROM advisory_review_records ORDER BY review_id').all().map((row) => ({ ...row })), ["
          if text.count(old) != 1:
              raise SystemExit('sqlite row normalization anchor missing or non-unique')
          migration_test.write_text(text.replace(old, new))

          ui_test = Path('scripts/test-recommendation-human-review-ui.mjs')
          text = ui_test.read_text()

          def replace_two_line_assert(text, message, replacement):
              marker = f"  '{message}');"
              if text.count(marker) != 1:
                  raise SystemExit(f'UI assertion message anchor missing or non-unique: {message}')
              marker_pos = text.index(marker)
              marker_line_start = text.rfind('\n', 0, marker_pos) + 1
              previous_line_start = text.rfind('\n', 0, marker_line_start - 1) + 1
              end = marker_pos + len(marker)
              return text[:previous_line_start] + replacement + text[end:]

          text = replace_two_line_assert(
              text,
              'Final disposition UI copy must preserve the execution boundary',
              "assert.ok(ui.includes('Approved / Rejected are Human Review dispositions only. They do not execute Amazon changes.'),\n  'Final disposition UI copy must preserve the execution boundary');"
          )
          text = replace_two_line_assert(
              text,
              'Historical Learning semantics copy must reject disposition effectiveness inference',
              "assert.ok(ui.includes('Recurrence and final disposition are not effectiveness. Approved is not executed or successful; rejected is not failed.'),\n  'Historical Learning semantics copy must reject disposition effectiveness inference');"
          )
          text = replace_two_line_assert(
              text,
              'Candidate Library review filter must expose Approved and Rejected',
              "assert.ok(ui.includes(\"['approved','Approved']\") && ui.includes(\"['rejected','Rejected']\"),\n  'Candidate Library review filter must expose Approved and Rejected');"
          )
          ui_test.write_text(text)

          historical_ui = Path('scripts/test-historical-review-learning-ui.mjs')
          text = historical_ui.read_text()
          old = "for (const semantic of ['recurrenceIsEffectiveness', 'acknowledgedMeansApproved', 'acknowledgedMeansExecuted', 'needsReviewMeansRejected', 'historicalOutcomeAvailable', 'automaticFeedbackIntoRecommendations']) {"
          new = "for (const semantic of ['recurrenceIsEffectiveness', 'acknowledgedMeansApproved', 'acknowledgedMeansExecuted', 'needsReviewMeansRejected', 'approvedMeansExecuted', 'approvedMeansSuccessful', 'rejectedMeansFailed', 'finalDispositionIsEffectiveness', 'historicalOutcomeAvailable', 'automaticFeedbackIntoRecommendations']) {"
          if text.count(old) != 1:
              raise SystemExit('historical semantic validation anchor missing or non-unique')
          text = text.replace(old, new, 1)
          old = """for (const fragment of [
  'Historical Review Learning',
  'Recurrence is not effectiveness.',
  'Acknowledged is not approved or executed; needs_review is not rejected or failed.',
  'Historical Learning never changes recommendation rules or execution authority.',
  'No learning weight, rule mutation, recommendation mutation, execution, or Amazon authority is created.',
]) assert.ok(ui.includes(fragment), `Historical Learning safety copy missing: ${fragment}`);"""
          new = """for (const fragment of [
  'Historical Review Learning',
  'Recurrence and final disposition are not effectiveness.',
  'Approved is not executed or successful; rejected is not failed.',
  'Historical Learning never changes recommendation rules or execution authority.',
  'No learning weight, rule mutation, recommendation mutation, execution, or Amazon authority is created.',
]) assert.ok(ui.includes(fragment), `Historical Learning safety copy missing: ${fragment}`);"""
          if text.count(old) != 1:
              raise SystemExit('historical safety copy anchor missing or non-unique')
          text = text.replace(old, new, 1)
          old = """assert.doesNotMatch(ui, /data-cfhr-set=\"(?:approved|rejected|execute)\"/,
  'Historical Learning must not expose approval/rejection/execution actions');"""
          new = """assert.doesNotMatch(ui, /data-cfhr-set=\"execute\"/,
  'Historical Learning must not expose execution actions');
assert.ok(ui.includes('Approved / Rejected are Human Review dispositions only. They do not execute Amazon changes.'),
  'Historical Learning must preserve the Human Review final-disposition execution boundary');"""
          if text.count(old) != 1:
              raise SystemExit('historical action-boundary anchor missing or non-unique')
          historical_ui.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-final-disposition-pr-bootstrap.yml
      - name: Run focused regression suite
        run: |
          node --check cloudflare/runtime/csv-recommendation-human-review-contract.js
          node --check cloudflare/runtime/csv-recommendation-human-review-api.js
          node --check cloudflare/runtime/historical-review-learning.js
          node --check cloudflare/runtime/data-health-api.js
          node --check cloudflare/runtime/operator-work-queue.js
          node --check assets/cloudflare-native-csv-recommendation-human-review-v1.js
          node --check scripts/test-recommendation-human-review-ui.mjs
          node --check scripts/test-historical-review-learning-ui.mjs
          node scripts/test-human-review-final-disposition.mjs
          node scripts/test-recommendation-human-review-contract.mjs
          node scripts/test-recommendation-human-review-persistence.mjs
          node scripts/test-recommendation-human-review-ui.mjs
          node scripts/test-historical-review-learning.mjs
          node scripts/test-historical-review-learning-integration.mjs
          node scripts/test-historical-review-learning-ui.mjs
          node scripts/test-operator-work-queue-contract.mjs
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add review-only final dispositions'
          git push origin HEAD:feature/human-review-final-disposition-v1
