name: Human Review Final Disposition Dev D1 Migration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: runtime-final-disposition-dev-migration
  cancel-in-progress: false

jobs:
  migrate-dev:
    if: github.head_ref == 'acceptance/259-human-review-final-disposition-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HUMAN_REVIEW_ACCEPTANCE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_STORE_DB_ID: 123b2a32-d78b-4de9-8318-08e35cefb008
      TARGET_MAIN_SHA: fea3005caf7b233870b75787162a580b1d22a28e
    steps:
      - name: Checkout acceptance control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require explicit Dev migration sentinel
        run: |
          set -euo pipefail
          test -f .runtime-final-disposition-dev-migrate
          test "$(cat .runtime-final-disposition-dev-migrate)" = "APPLY_DEV_0025=fea3005caf7b233870b75787162a580b1d22a28e"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repository-pinned Wrangler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.114.0
      - name: Checkout exact protected main target
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$TARGET_MAIN_SHA"
          git checkout --detach "$TARGET_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN_SHA"
      - name: Record pre-migration D1 invariants — read only
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createD1RestDatabase } from './scripts/cloudflare-d1-rest-adapter.mjs';
          const db = createD1RestDatabase({ accountId:process.env.CLOUDFLARE_ACCOUNT_ID, databaseId:process.env.DEV_STORE_DB_ID, apiToken:process.env.CLOUDFLARE_API_TOKEN });
          const count = await db.prepare('SELECT COUNT(*) AS count FROM advisory_review_records').first();
          const triggers = await db.prepare("SELECT name, sql FROM sqlite_master WHERE type='trigger' AND name IN ('trg_advisory_review_binding_immutable','trg_advisory_review_no_delete','trg_advisory_review_csv_authority_guard') ORDER BY name").all();
          const indexes = await db.prepare("SELECT name FROM sqlite_master WHERE type='index' AND name IN ('uq_advisory_review_source_recommendation','idx_advisory_review_state_updated','idx_advisory_review_entity') ORDER BY name").all();
          if (triggers.results.length !== 3) throw new Error(`pre_trigger_count:${triggers.results.length}`);
          if (indexes.results.length !== 3) throw new Error(`pre_index_count:${indexes.results.length}`);
          const snapshot = { rowCount:Number(count?.count || 0), triggers:triggers.results.map(x=>x.name), indexes:indexes.results.map(x=>x.name) };
          await writeFile('/tmp/dev-d1-pre.json', JSON.stringify(snapshot));
          console.log(JSON.stringify(snapshot, null, 2));
          NODE
      - name: Require exactly 0025 pending
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 migrations list ads-ops-store-dev --remote --env dev --config cloudflare/runtime/wrangler.native.jsonc | tee /tmp/dev-pending.txt
          grep -F '0025_store_advisory_review_final_disposition.sql' /tmp/dev-pending.txt
      - name: Apply governed Dev Store migration 0025
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 migrations apply ads-ops-store-dev --remote --env dev --config cloudflare/runtime/wrangler.native.jsonc | tee /tmp/dev-apply.txt
          grep -F '0025_store_advisory_review_final_disposition.sql' /tmp/dev-apply.txt
      - name: Verify Dev migration ledger advanced
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 migrations list ads-ops-store-dev --remote --env dev --config cloudflare/runtime/wrangler.native.jsonc | tee /tmp/dev-post-list.txt
          if grep -F '0025_store_advisory_review_final_disposition.sql' /tmp/dev-post-list.txt; then
            echo '0025 still pending after apply' >&2
            exit 1
          fi
      - name: Verify post-migration D1 invariants — read only
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { createD1RestDatabase } from './scripts/cloudflare-d1-rest-adapter.mjs';
          const pre = JSON.parse(await readFile('/tmp/dev-d1-pre.json', 'utf8'));
          const db = createD1RestDatabase({ accountId:process.env.CLOUDFLARE_ACCOUNT_ID, databaseId:process.env.DEV_STORE_DB_ID, apiToken:process.env.CLOUDFLARE_API_TOKEN });
          const count = await db.prepare('SELECT COUNT(*) AS count FROM advisory_review_records').first();
          assert.equal(Number(count?.count || 0), pre.rowCount, 'advisory_review_row_count_changed');
          const table = await db.prepare("SELECT sql FROM sqlite_master WHERE type='table' AND name='advisory_review_records'").first();
          assert(String(table?.sql || '').includes("'approved'"), 'approved_state_missing');
          assert(String(table?.sql || '').includes("'rejected'"), 'rejected_state_missing');
          const triggers = await db.prepare("SELECT name, sql FROM sqlite_master WHERE type='trigger' AND name IN ('trg_advisory_review_binding_immutable','trg_advisory_review_no_delete','trg_advisory_review_csv_authority_guard') ORDER BY name").all();
          assert.equal(triggers.results.length, 3, 'post_trigger_count');
          const authority = triggers.results.find(x=>x.name==='trg_advisory_review_csv_authority_guard');
          assert(String(authority?.sql || '').includes('CSV_ADVISORY_REVIEW_AUTHORITY_REQUIRED'), 'csv_authority_guard_error_missing');
          const indexes = await db.prepare("SELECT name FROM sqlite_master WHERE type='index' AND name IN ('uq_advisory_review_source_recommendation','idx_advisory_review_state_updated','idx_advisory_review_entity') ORDER BY name").all();
          assert.equal(indexes.results.length, 3, 'post_index_count');
          const ledger = await db.prepare("SELECT name FROM d1_migrations WHERE name='0025_store_advisory_review_final_disposition.sql'").all();
          assert.equal(ledger.results.length, 1, '0025_ledger_missing');
          console.log(JSON.stringify({ ok:true, rowCount:Number(count.count), triggerNames:triggers.results.map(x=>x.name), indexNames:indexes.results.map(x=>x.name), ledger:'0025_store_advisory_review_final_disposition.sql' }, null, 2));
          NODE
